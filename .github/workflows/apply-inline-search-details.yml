name: apply-inline-search-details

on:
  push:
    branches:
      - feature/m2-guest-browsing
    paths:
      - .github/workflows/apply-inline-search-details.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m2-guest-browsing
      - name: Apply inline selection details
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('switch/source/main.cpp')
          s = p.read_text()

          def rep(old, new, count=1):
              global s
              actual = s.count(old)
              if actual != count:
                  raise SystemExit(f'expected {count} matches, found {actual}: {old[:80]!r}')
              s = s.replace(old, new, count)

          rep('#include <thread>\n#include <utility>\n', '#include <thread>\n#include <utility>\n#include <vector>\n')

          rep('    brls::Box* search_results_box_{nullptr};\n    brls::Label* search_selection_label_{nullptr};\n',
              '    brls::Box* search_results_box_{nullptr};\n    std::vector<std::pair<std::string, brls::Label*>> search_result_detail_labels_;\n')

          old = '''    void rebuild_search_results() {
        if (!search_results_box_) return;
        while (!search_results_box_->getChildren().empty()) {
            search_results_box_->removeView(search_results_box_->getChildren().back());
        }

        for (const auto& result : search_model_.results()) {
            const auto identity = ttnx::core::browse_result_identity(result);
            if (identity.empty()) continue;

            std::string title = "[" + ttnx::core::search_result_kind_label(result.kind) + "] ";
            title += result.title.empty() ? "Untitled result" : result.title;
            auto* select = button(
                search_results_box_,
                bounded_ui_text(title, kMaxUiTitleChars));
            select->setHeight(72);
            select->registerClickAction([this, identity](brls::View*) {
                if (!search_model_.select(identity)) return true;
                refresh_search_selection();
                return true;
            });

            const auto metadata = ttnx::core::search_result_metadata_display(result);
            if (!metadata.empty()) {
                auto* metadata_label = label(
                    search_results_box_,
                    bounded_ui_text(metadata, kMaxUiMetadataChars),
                    18);
                metadata_label->setMarginBottom(14);
            }
        }
    }

    void refresh_search_selection() {
        if (!search_selection_label_) return;
        if (const auto* result = selected_search_result()) {
            search_selection_label_->setText(
                ttnx::core::search_result_selection_display(*result));
        } else {
            search_selection_label_->setText(
                "Select a result to inspect its normalized identity. Playback is not enabled yet.");
        }
    }
'''
          new = '''    void rebuild_search_results() {
        if (!search_results_box_) return;
        while (!search_results_box_->getChildren().empty()) {
            search_results_box_->removeView(search_results_box_->getChildren().back());
        }
        search_result_detail_labels_.clear();

        for (const auto& result : search_model_.results()) {
            const auto identity = ttnx::core::browse_result_identity(result);
            if (identity.empty()) continue;

            std::string title = "[" + ttnx::core::search_result_kind_label(result.kind) + "] ";
            title += result.title.empty() ? "Untitled result" : result.title;
            auto* select = button(
                search_results_box_,
                bounded_ui_text(title, kMaxUiTitleChars));
            select->setHeight(72);

            const auto metadata = ttnx::core::search_result_metadata_display(result);
            if (!metadata.empty()) {
                auto* metadata_label = label(
                    search_results_box_,
                    bounded_ui_text(metadata, kMaxUiMetadataChars),
                    18);
                metadata_label->setMarginBottom(14);
            }

            auto* detail = label(search_results_box_, "", 18);
            detail->setMarginBottom(14);
            detail->setVisibility(brls::Visibility::GONE);
            search_result_detail_labels_.emplace_back(identity, detail);

            select->registerClickAction([this, identity](brls::View*) {
                if (!search_model_.select(identity)) return true;
                refresh_search_selection();
                return true;
            });
        }
    }

    void refresh_search_selection() {
        const auto& selected_identity = search_model_.selected_identity();
        const auto* selected = selected_search_result();
        for (auto& [identity, detail] : search_result_detail_labels_) {
            if (!detail) continue;
            const bool show = selected && !selected_identity.empty() && identity == selected_identity;
            if (show) {
                detail->setText(ttnx::core::search_result_selection_display(*selected));
                detail->setVisibility(brls::Visibility::VISIBLE);
            } else {
                detail->setText("");
                detail->setVisibility(brls::Visibility::GONE);
            }
        }
    }
'''
          rep(old, new)

          rep('        search_results_box_ = nullptr;\n        search_selection_label_ = nullptr;\n',
              '        search_results_box_ = nullptr;\n        search_result_detail_labels_.clear();\n')

          old2 = '''            search_selection_label_ = label(
                content,
                "Select a result to inspect its normalized identity. Playback is not enabled yet.",
                18);
            label(content,
                  "Load more is disabled for this hardware gate. No Shorts, ads, promoted or shopping renderers may reach this list.",
                  18);
'''
          new2 = '''            label(content,
                  "Press A on a result to expand its normalized identity and clean canonical URL directly below that result. Playback is not enabled yet.",
                  18);
            label(content,
                  "Load more is disabled for this hardware gate. No Shorts, ads, promoted or shopping renderers may reach this list.",
                  18);
'''
          rep(old2, new2)
          p.write_text(s)

          status = Path('docs/PROJECT_STATUS.md')
          d = status.read_text()
          marker = 'Live Search remains **not hardware accepted** until the new NRO passes the next physical Search test.\n'
          if marker not in d:
              raise SystemExit('status acceptance marker not found')
          replacement = '''First-page live Search is now **PHYSICALLY ACCEPTED** at `a5fb638abd6e41d82490a460f41ea096b11d1ea5`.

Real-Switch verification confirmed:
- the NRO boots normally from Spaira;
- the manually established guest session reaches `Guest ready`;
- explicit Search for `Nintendo Switch homebrew` returns 15 normalized first-page results;
- controller navigation between result cards works;
- selecting a normal video produces the expected normalized video ID and clean canonical YouTube URL;
- no Shorts, ad, promoted or shopping result was observed in the accepted Search list;
- continuation remained disabled for this gate.

Hardware feedback also exposed a UI-only selection-detail issue: the single detail label lived after the entire results list, so selecting any result except one near the bottom could update details off-screen. The follow-up keeps the accepted Search/network architecture unchanged and moves selection details inline beneath the selected result.
'''
          d = d.replace(marker, replacement, 1)
          status.write_text(d)
          PY

          git config user.name "GlitchedZeus"
          git config user.email "user91746@protonmail.com"
          git add switch/source/main.cpp docs/PROJECT_STATUS.md
          git commit -m "search: show selected result details inline"
          git push origin HEAD:feature/m2-guest-browsing
