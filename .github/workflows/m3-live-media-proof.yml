name: M3 LIVE source-and-media proof (NO NRO)
# This tests current public video extraction and actual signed MP4 bytes.
# It is NOT the Switch native extractor and never publishes a test NRO.
# Retired automatic gate: M3 no longer relies on legacy yt-dlp/progressive
# MP4 from GitHub-hosted IPs. Retain as an explicit manual diagnostic only.
# The CURRENT mandatory live source/segment check is m3-vision-hls-live.yml.
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install current reference YouTube extractor and JS challenge solver
        run: python -m pip install --upgrade 'yt-dlp[default]'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verify offline validation and no URL logging
        run: python -m unittest discover -s tests -p live_media_preflight_tests.py -v
      - name: Reference-check actual public normal videos and MP4 CDN bytes
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python tools/live_video_preflight.py \
            --video-id 2kD9v7Q3vec \
            --video-id 7E7lY-jUybc \
            --minimum-verified 1
      - name: Interpret this gate correctly
        if: always()
        run: |
          echo "LIVE PROOF IS AN EXTERNAL REFERENCE, NOT SWITCH PLAYBACK."
          echo "Do NOT publish an NRO without validating native extractor + native media transfer."
          echo "Never upload raw resolver JSON or any signed media URL."
