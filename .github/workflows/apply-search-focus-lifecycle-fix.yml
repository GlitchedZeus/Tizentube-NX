name: apply-search-focus-lifecycle-fix

on:
  push:
    branches:
      - feature/m2-guest-browsing
    paths:
      - .github/workflows/apply-search-focus-lifecycle-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m2-guest-browsing
          fetch-depth: 0
      - name: Apply Search focus/page-lifecycle fix
        run: python3 .github/scripts/apply_search_focus_fix.py
      - name: Validate and push
        run: |
          git diff --check
          git status --short
          git config user.name "GlitchedZeus"
          git config user.email "user91746@protonmail.com"
          rm .github/workflows/apply-search-focus-lifecycle-fix.yml
          rm .github/scripts/apply_search_focus_fix.py
          git add -A
          git diff --cached --check
          git commit -m "ui: preserve Search focus and sidebar lifecycle"
          git push origin HEAD:feature/m2-guest-browsing
