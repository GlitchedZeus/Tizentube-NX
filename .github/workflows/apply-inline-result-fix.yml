name: apply-inline-result-fix

on:
  push:
    branches:
      - feature/m2-guest-browsing
    paths:
      - .github/workflows/apply-inline-result-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m2-guest-browsing
          fetch-depth: 0

      - name: Apply asserted inline Search result fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, name):
              count = text.count(old)
              assert count == 1, f"{name}: expected 1 match, found {count}"
              return text.replace(old, new, 1)

          p = Path('switch/source/main.cpp')
          s = p.read_text()

          # Hardware rejected the pushed SearchResultActivity: the real Switch
          # stayed black until B popped it, at which point the correct content
          # flashed briefly. Keep result details on the accepted Search page.
          s, n = re.subn(
              r'\nclass SearchResultActivity : public brls::Activity \{.*?\n\};\n\nclass ShellActivity',
              '\nclass ShellActivity',
              s,
              count=1,
              flags=re.S,
          )
          assert n == 1, f"remove SearchResultActivity: expected 1 match, found {n}"

          # This helper becomes unused once the separate Activity path is gone.
          s, n = re.subn(
              r'\n    const ttnx::core::BrowseResult\* selected_search_result\(\) const \{.*?\n    \}\n\n    void rebuild_search_results\(\)',
              '\n    void rebuild_search_results()',
              s,
              count=1,
              flags=re.S,
          )
          assert n == 1, f"remove selected_search_result helper: expected 1 match, found {n}"

          old = (
              "    void tick() {\n"
              "        pump_network_result();\n"
              "        pump_search_result();\n"
              "        update_frame_rate();\n"
              "    }"
          )
          new = (
              "    void tick() {\n"
              "        pump_network_result();\n"
              "        pump_search_result();\n"
              "        if (search_selection_rebuild_pending_) {\n"
              "            // The A-button callback has returned before tick() runs.\n"
              "            // Rebuild here instead of deleting the focused result\n"
              "            // button while its own click callback is executing.\n"
              "            search_selection_rebuild_pending_ = false;\n"
              "            rebuild_search_results();\n"
              "        }\n"
              "        update_frame_rate();\n"
              "    }"
          )
          s = replace_once(s, old, new, 'tick defer')

          old = (
              "    brls::Button* search_action_button_{nullptr};\n"
              "    brls::Box* search_results_box_{nullptr};"
          )
          new = old + "\n    bool search_selection_rebuild_pending_{false};"
          s = replace_once(s, old, new, 'selection rebuild member')

          old = (
              "        for (const auto& result : search_model_.results()) {\n"
              "            const auto identity = ttnx::core::browse_result_identity(result);"
          )
          new = (
              "        const auto selected_identity = search_model_.selected_identity();\n"
              "        brls::Button* selected_button = nullptr;\n\n"
              "        for (const auto& result : search_model_.results()) {\n"
              "            const auto identity = ttnx::core::browse_result_identity(result);"
          )
          s = replace_once(s, old, new, 'selected identity setup')

          old = (
              "            select->registerClickAction([this, identity](brls::View*) {\n"
              "                if (!search_model_.select(identity)) return true;\n"
              "                if (const auto* selected = selected_search_result()) {\n"
              "                    brls::Application::pushActivity(new SearchResultActivity(*selected));\n"
              "                }\n"
              "                return true;\n"
              "            });\n\n"
              "            const auto metadata = ttnx::core::search_result_metadata_display(result);"
          )
          new = (
              "            const bool is_selected = identity == selected_identity;\n"
              "            if (is_selected) selected_button = select;\n"
              "            select->registerClickAction([this, identity](brls::View*) {\n"
              "                if (!search_model_.select(identity)) return true;\n"
              "                // Defer the destructive list rebuild until the next\n"
              "                // ShellActivity::tick(), after this callback returns.\n"
              "                search_selection_rebuild_pending_ = true;\n"
              "                return true;\n"
              "            });\n\n"
              "            if (is_selected) {\n"
              "                auto* detail_label = label(\n"
              "                    search_results_box_,\n"
              "                    ttnx::core::search_result_selection_display(result),\n"
              "                    18);\n"
              "                detail_label->setMarginBottom(14);\n"
              "            }\n\n"
              "            const auto metadata = ttnx::core::search_result_metadata_display(result);"
          )
          s = replace_once(s, old, new, 'result click inline detail')

          old = (
              "                metadata_label->setMarginBottom(14);\n"
              "            }\n"
              "        }\n"
              "    }\n\n"
              "    void refresh_search_page(bool rebuild_results)"
          )
          new = (
              "                metadata_label->setMarginBottom(14);\n"
              "            }\n"
              "        }\n\n"
              "        // Restore controller focus to the same normalized result.\n"
              "        // Borealis will keep the focused card in the scroll viewport,\n"
              "        // with the selected detail block immediately beneath it.\n"
              "        if (selected_button) brls::Application::giveFocus(selected_button);\n"
              "    }\n\n"
              "    void refresh_search_page(bool rebuild_results)"
          )
          s = replace_once(s, old, new, 'restore result focus')

          s = replace_once(
              s,
              'Press A on any result to open its normalized ID and clean canonical URL.',
              'Press A on any result to show its normalized ID and clean canonical URL directly below that result.',
              'Search hint')

          assert 'class SearchResultActivity' not in s
          assert 'pushActivity(new SearchResultActivity' not in s
          p.write_text(s)

          p = Path('docs/PROJECT_STATUS.md')
          s = p.read_text()
          old = (
              "The follow-up UI opens a dedicated Borealis result-detail activity when A is pressed. It displays normalized title/type/ID and, when the stable ID is valid, a locally generated canonical clean URL immediately, with B returning to Search:\n\n"
              "- Video: `https://www.youtube.com/watch?v=VIDEO_ID`\n"
              "- Channel: canonical stable `/channel/CHANNEL_ID` URL\n"
              "- Playlist: canonical `playlist?list=PLAYLIST_ID` URL\n\n"
              "The detail activity consumes only the already-normalized in-memory result and performs no additional network request. No source tracking parameters are preserved."
          )
          new = (
              "The first follow-up attempted a dedicated Borealis result-detail activity at clean checkpoint `5e566c0a4a8c2b5c040686bcc95a305c675cc4ce`. Physical hardware rejected that presentation: pressing A produced a black blank pushed activity, while the correct normalized detail content became visible only for a fraction of a second during the B/pop transition. The underlying result data remained correct; this was a presentation/navigation failure.\n\n"
              "The replacement keeps result details inside the already-stable Search `ScrollingFrame`. Pressing A selects the normalized result, returns from the button callback, and schedules a one-frame-deferred list rebuild. On the next UI tick, the selected result's normalized type/title/ID and locally generated clean canonical URL are inserted directly below that result, and controller focus is restored to the same card:\n\n"
              "- Video: `https://www.youtube.com/watch?v=VIDEO_ID`\n"
              "- Channel: canonical stable `/channel/CHANNEL_ID` URL\n"
              "- Playlist: canonical `playlist?list=PLAYLIST_ID` URL\n\n"
              "The one-frame defer is deliberate: it avoids removing/deleting the focused Borealis button while that button's own A callback is executing. The inline detail uses only the already-normalized in-memory result and performs no additional network request. No source tracking parameters are preserved."
          )
          s = replace_once(s, old, new, 'status result selection seam')

          old = (
              "The hardware test also found one presentation-only defect: the selection detail label was positioned after the whole first-page result list, making it difficult to see for non-bottom results. The next UI checkpoint replaces that list-bottom label with a dedicated result-detail activity opened by A and closed with B. This does not alter the accepted Search POST/parser/session/network path."
          )
          new = (
              "The hardware test also found one presentation-only defect: the selection detail label was positioned after the whole first-page result list, making it difficult to see for non-bottom results. A dedicated result-detail activity was then tested at `5e566c0a4a8c2b5c040686bcc95a305c675cc4ce` and failed its physical UI gate: the pushed activity stayed black until B was pressed, when the correct detail screen flashed briefly during the pop transition. That checkpoint is **NOT accepted** as a result-detail UI.\n\n"
              "The next UI-only checkpoint therefore removes the separate Activity path and expands the selected normalized result inline within the existing hardware-stable Search page. This does not alter the accepted Search POST/parser/session/network path."
          )
          s = replace_once(s, old, new, 'status activation gate')
          p.write_text(s)

          p = Path('docs/ROADMAP.md')
          s = p.read_text()
          old = (
              "- [x] Replace the list-bottom selection detail with a dedicated A-open/B-back result-detail activity\n"
              "- [ ] Real-hardware result-detail activity acceptance\n"
              "- [ ] Re-enable continuation / `Load more` as a separate hardware-gated slice"
          )
          new = (
              "- [x] Attempt dedicated A-open/B-back result-detail activity\n"
              "- [x] Hardware-reject the dedicated result-detail activity after black-screen/pop-transition failure\n"
              "- [x] Replace it with a one-frame-deferred inline selected-result detail block on the stable Search page\n"
              "- [ ] Real-hardware inline result-detail acceptance\n"
              "- [ ] Re-enable continuation / `Load more` as a separate hardware-gated slice"
          )
          s = replace_once(s, old, new, 'roadmap inline detail gate')
          p.write_text(s)
          PY

          git diff --check
          git status --short

          git config user.name "GlitchedZeus"
          git config user.email "user91746@protonmail.com"
          rm .github/workflows/apply-inline-result-fix.yml
          git add -A
          git diff --cached --check
          git commit -m "search: show selected result details inline"
          git push origin HEAD:feature/m2-guest-browsing
