name: apply-home-first-page-ui

on:
  push:
    branches:
      - feature/m2-guest-browsing

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'ci: run Home UI patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m2-guest-browsing
          fetch-depth: 0
      - name: Apply Home UI patch
        run: python3 .github/scripts/patch_home_first_page_ui.py
      - name: Host validation
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
      - name: Remove temporary patch files
        run: |
          rm .github/workflows/apply-home-first-page-ui.yml
          rm .github/scripts/patch_home_first_page_ui.py
      - name: Commit and push
        run: |
          git config user.name GlitchedZeus
          git config user.email user91746@protonmail.com
          git add switch/source/main.cpp .github/workflows/apply-home-first-page-ui.yml .github/scripts/patch_home_first_page_ui.py
          git commit -m "home: wire explicit guest Home first page"
          git push origin HEAD:feature/m2-guest-browsing
