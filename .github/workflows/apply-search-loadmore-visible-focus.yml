name: apply-search-loadmore-visible-focus

on:
  push:
    branches:
      - feature/m2-guest-browsing
    paths:
      - .github/workflows/apply-search-loadmore-visible-focus.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m2-guest-browsing
          fetch-depth: 0

      - name: Preserve visible Load more focus after continuation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('switch/source/main.cpp')
          text = path.read_text()

          replacements = [
              (
                  '''    void tick() {\n        // Apply a continuation-focus request one frame after rows are\n        // attached so Yoga has current coordinates before ScrollingFrame\n        // recenters the selected result.\n        apply_pending_search_focus();\n        pump_network_result();\n        pump_search_result();\n        update_frame_rate();\n    }\n''',
                  '''    void tick() {\n        pump_network_result();\n        pump_search_result();\n        update_frame_rate();\n    }\n'''
              ),
              (
                  '''    std::vector<SearchDetailRow> search_detail_rows_;\n    std::string pending_search_focus_identity_;\n''',
                  '''    std::vector<SearchDetailRow> search_detail_rows_;\n'''
              ),
              (
                  '''    void apply_pending_search_focus() {\n        if (pending_search_focus_identity_.empty()) return;\n\n        // A continuation may finish after the user leaves Search. Never\n        // steal focus back from another tab or retain page-owned pointers.\n        if (!search_results_box_) {\n            pending_search_focus_identity_.clear();\n            return;\n        }\n\n        const std::string wanted = pending_search_focus_identity_;\n        pending_search_focus_identity_.clear();\n        for (const auto& row : search_detail_rows_) {\n            if (row.identity == wanted && row.button) {\n                brls::Application::giveFocus(row.button);\n                return;\n            }\n        }\n    }\n\n''',
                  ''''''
              ),
              (
                  '''        pending_search_focus_identity_.clear();\n\n        // Full rebuilding is reserved for a genuinely new/reconstructed result\n''',
                  '''        // Full rebuilding is reserved for a genuinely new/reconstructed result\n'''
              ),
              (
                  '''            const auto first_new_identity =\n                append_search_results_from(previous_result_count);\n            refresh_search_inline_details();\n            refresh_search_page(false, search_model_.end_of_results());\n\n            // Appending rows above an already-focused Load more button moves\n            // its layout position without another focus-gained event. Defer\n            // focus to the first newly-added row until the next frame so the\n            // selector remains visible and the next page begins naturally.\n            if (!first_new_identity.empty()) {\n                pending_search_focus_identity_ = first_new_identity;\n            }\n''',
                  '''            (void)append_search_results_from(previous_result_count);\n            refresh_search_inline_details();\n            refresh_search_page(false, search_model_.end_of_results());\n\n            // Real-hardware testing proved that force-focusing the first newly\n            // appended row can leave Borealis focus off-screen after the nested\n            // result box changes height. Keep the user's already-visible Load\n            // more focus instead. The explicit Up route is refreshed above and\n            // therefore enters the actual last appended result naturally. A\n            // terminal continuation still uses refresh_search_page()'s existing\n            // fallback before Load more is hidden.\n'''
              ),
              (
                  '''        search_detail_rows_.clear();\n        pending_search_focus_identity_.clear();\n        auto* scroll = new brls::ScrollingFrame();\n''',
                  '''        search_detail_rows_.clear();\n        auto* scroll = new brls::ScrollingFrame();\n'''
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one main.cpp match, got {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)

          gates = Path('docs/HARDWARE_GATES.md')
          doc = gates.read_text()
          marker = '''## Current physical gate — Search continuation focus polish\n'''
          if marker not in doc:
              raise SystemExit('hardware gate marker not found')

          note = '''### First continuation-focus fix — hardware rejected\n\nHardware-tested NRO head: `d9f33ffef915220f4deb31edb2108b39448bf200`\n\nThe continuation request/data path still works, and the explicit Up route remains useful, but the deliberate post-append focus transfer to the first newly-added result is **REJECTED on hardware**. Three physical-Switch screenshots show the sequence clearly:\n\n- before `Load more`, the selector is visibly on the `Load more` button;\n- after the append completes, the viewport shows the newly-appended tail and the `Load more` button, but no selector is visible;\n- one Down press immediately scrolls back and selects the second newly-added result, with the first newly-added result directly above it.\n\nThis proves the new rows were appended correctly and focus had moved to the intended first newly-added row, but pinned Borealis did not recenter the `ScrollingFrame` viewport to that programmatic focus after the nested result box changed height. The selector was therefore alive but off-screen.\n\nThe next candidate removes that programmatic focus steal. After a successful non-terminal continuation, `Load more` remains the visible focused control; its refreshed custom Up route targets the actual current last result. Terminal continuation behavior keeps the existing last-result fallback before hiding `Load more`. No parser, request, network-policy or security behavior changes in this fix.\n\n'''
          if note not in doc:
              doc = doc.replace(marker, note + marker, 1)
              gates.write_text(doc)
          PY

      - name: Host validation
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      - name: Commit and push
        run: |
          git config user.name "GlitchedZeus"
          git config user.email "user91746@protonmail.com"
          git add switch/source/main.cpp docs/HARDWARE_GATES.md
          git commit -m "ui: preserve visible Load more focus after append"
          git push origin HEAD:feature/m2-guest-browsing
