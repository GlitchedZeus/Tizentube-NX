name: M3 experimental media transport compile
on:
  pull_request:
    paths:
      - 'switch/source/libnx_http_client.*'
      - 'include/tizentube_nx/playback/**'
      - 'src/core/media_*.cpp'
      - 'Makefile.switch'
      - '.github/workflows/m3-media-transport-build.yml'
  push:
    paths:
      - 'switch/source/libnx_http_client.*'
      - 'include/tizentube_nx/playback/**'
      - 'src/core/media_*.cpp'
      - 'Makefile.switch'
      - '.github/workflows/m3-media-transport-build.yml'
  workflow_dispatch:
jobs:
  compile-media-transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Compile opt-in native media socket code without enabling playback
        run: >-
          docker run --rm
          -v "$PWD:/work" -w /work
          devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282
          make -f Makefile.switch TTNX_M3_MEDIA_EXPERIMENT=1 BUILD=build-m3-media -j2
      - name: Verify isolated compile output
        run: |
          test -s tizentube_nx.nro
          test -s tizentube_nx.elf
          sha256sum tizentube_nx.nro
      - name: Clarify acceptance boundary
        run: |
          echo "This is only a native media transport compile gate."
          echo "Not a YouTube playback candidate. No NRO uploaded from this lane."
