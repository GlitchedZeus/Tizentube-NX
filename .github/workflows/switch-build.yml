name: switch-build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-nro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build NRO with devkitA64
        run: >-
          docker run --rm
          -v "$PWD:/work"
          -w /work
          devkitpro/devkita64:latest
          make -f Makefile.switch -j2
      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: tizentube-nx-nro
          path: tizentube_nx.nro
          if-no-files-found: error
