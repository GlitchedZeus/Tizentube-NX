name: finalize-home-first-page

on:
  push:
    branches:
      - feature/m2-guest-browsing

permissions:
  contents: write

jobs:
  finalize:
    if: "${{ github.event.head_commit.message == 'ci: run Home first-page finalizer' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m2-guest-browsing
          fetch-depth: 0
      - name: Apply Home hardening and docs
        run: python3 .github/scripts/finalize_home_first_page.py
      - name: Host validation
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
      - name: Remove temporary finalizer files
        run: |
          rm .github/workflows/finalize-home-first-page.yml
          rm .github/scripts/finalize_home_first_page.py
      - name: Commit and push
        run: |
          git config user.name GlitchedZeus
          git config user.email user91746@protonmail.com
          git add src/core/home_response.cpp tests/home_response_tests.cpp switch/source/main.cpp docs/PROJECT_STATUS.md docs/ROADMAP.md docs/HARDWARE_GATES.md .github/workflows/finalize-home-first-page.yml .github/scripts/finalize_home_first_page.py
          git commit -m "home: harden first-page scope and record Search acceptance"
          git push origin HEAD:feature/m2-guest-browsing
