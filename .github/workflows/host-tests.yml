name: host-tests

# Preserve the newest build on this branch instead of burning CI workers on
# dozens of obsolete intermediary commits from a long development tranche.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test optional extraction service (offline)
        run: python3 -m unittest discover -s tests -p extractor_service_tests.py -v
      - name: Offline live-source preflight safety checks (no network)
        run: python3 -m unittest discover -s tests -p live_media_preflight_tests.py -v
      - name: Offline VisionOS HLS live-proof safety contracts
        run: python3 -m unittest discover -s tests -p vision_hls_live_probe_tests.py -v
      - name: Install host FFmpeg codec tools for real demux verification
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libmpv2
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Decode synthetic local HLS video + separate AAC (FFmpeg)
        run: python3 -m unittest discover -s tests -p local_av_demux_tests.py -v
      - name: M3 integrated Switch video-loop ownership and frame-latch contract
        run: python3 -m unittest discover -s tests -p m3_renderer_contract_tests.py -v
      - name: M3 ephemeral playback cache and concurrent startup contracts
        run: python3 -m unittest discover -s tests -p m3_ephemeral_cache_contract_tests.py -v
      - name: Offline M3 hardware log triage and privacy regressions
        run: python3 -m unittest discover -s tests -p m3_diagnostics_triage_tests.py -v
      - name: Verify isolated M3 offline-probe security contract
        run: python3 -m unittest discover -s tests -p m3_offline_probe_contract_tests.py -v
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Sanitized M4 streaming-accounting regressions
        run: |
          set -euo pipefail
          for target in rolling_media_budget rolling_stream_coordinator; do
            g++ -std=c++20 -Wall -Wextra -Werror -O1 -g \
              -fsanitize=address,undefined -fno-omit-frame-pointer \
              -Iinclude "tests/${target}_tests.cpp" \
              -o "/tmp/ttnx-${target}-san"
            "/tmp/ttnx-${target}-san"
          done
      - name: Sanitized M4 rolling SD and playlist tests
        run: |
          set -euo pipefail
          g++ -std=c++20 -Wall -Wextra -Werror -O1 -g \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -DTTNX_M4_ROLLING_HOST_TEST=1 \
            -Iinclude -Iswitch/source tests/rolling_hls_sink_tests.cpp \
            switch/source/rolling_hls_sink.cpp \
            -o /tmp/ttnx-rolling-hls-san
          /tmp/ttnx-rolling-hls-san
      - name: Sanitized reviewed-HTTPS to rolling-HLS integration tests
        run: |
          set -euo pipefail
          cmake -S . -B build-sanitized -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -O1 -g"
          cmake --build build-sanitized --parallel 2 \
            --target tizentube_nx_rolling_muxed_hls_tests
          ASAN_OPTIONS=detect_leaks=1 ctest --test-dir build-sanitized \
            -R '^rolling_muxed_hls$' --output-on-failure
      - name: Decode real growing H264/AAC HLS and verify zero-video-cache shutdown
        run: python3 -m unittest discover -s tests -p rolling_hls_live_decode_tests.py -v
      - name: Sanitized real growing HLS A/V decode and cancel regressions
        env:
          TTNX_M4_LIVE_SANITIZE: "1"
        run: python3 -m unittest discover -s tests -p rolling_hls_live_decode_tests.py -v
      - name: M4 native libmpv local-only probe isolation contract
        run: python3 -m unittest discover -s tests -p m4_local_player_contract_tests.py -v
      - name: Sanitized rolling local-playlist admission and hostile URI gate
        run: |
          set -euo pipefail
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -O1 -g \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Iinclude tests/local_live_hls_gate_tests.cpp \
            -o /tmp/ttnx-local-live-gate
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            /tmp/ttnx-local-live-gate
      - name: M4 worker stop/join/backpressure native lifecycle under ASan/UBSan
        run: |
          set -euo pipefail
          g++ -std=c++20 -Wall -Wextra -Werror -O1 -g -pthread \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -DTTNX_M4_ROLLING_HOST_TEST=1 \
            -Iinclude -Iswitch/source tests/rolling_hls_worker_tests.cpp \
            switch/source/rolling_hls_worker.cpp \
            -o /tmp/ttnx-rolling-worker-san
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            /tmp/ttnx-rolling-worker-san
      - name: Sanitized M4 player/producer lifetime and ownership gates
        run: |
          set -euo pipefail
          g++ -std=c++20 -Wall -Wextra -Werror -O1 -g -pthread \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -DTTNX_M4_ROLLING_HOST_TEST=1 -Iinclude -Iswitch/source \
            tests/rolling_playback_owner_tests.cpp \
            switch/source/rolling_playback_owner.cpp \
            switch/source/rolling_hls_worker.cpp \
            -o /tmp/ttnx-rolling-owner-san
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            /tmp/ttnx-rolling-owner-san
      - name: Switch TV browse/player layout under ASan and UBSan
        run: |
          set -euo pipefail
          for test in tv_layout tv_player_layout; do
            g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror \
              -O1 -g -fsanitize=address,undefined \
              -fno-omit-frame-pointer -Iinclude \
              "tests/${test}_tests.cpp" -o "/tmp/ttnx-${test}-san"
            ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
              "/tmp/ttnx-${test}-san"
          done
      - name: Verify bounded on-device Library under ASan and UBSan
        run: |
          set -euo pipefail
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -O1 -g \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Iinclude tests/local_library_tests.cpp \
            -o /tmp/ttnx-local-library-san
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            /tmp/ttnx-local-library-san
      - name: Resume-to-playback gate under ASan and UBSan
        run: |
          set -euo pipefail
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -O1 -g \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Iinclude tests/playback_resume_gate_tests.cpp \
            -o /tmp/ttnx-playback-resume-san
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            /tmp/ttnx-playback-resume-san
      - name: TV player overlay controller model under ASan and UBSan
        run: |
          set -euo pipefail
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -O1 -g \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Iinclude tests/tv_player_controls_tests.cpp \
            -o /tmp/ttnx-tv-player-controls-san
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            /tmp/ttnx-tv-player-controls-san
      - name: Local History/Watch Later/Following 20-row pager sanitizer gate
        run: |
          set -euo pipefail
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -O1 -g \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Iinclude tests/library_pager_tests.cpp \
            -o /tmp/ttnx-library-pager-san
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            /tmp/ttnx-library-pager-san
      - name: M4 streaming TS validator normal and ASan/UBSan
        run: |
          set -euo pipefail
          for mode in normal sanitized; do
            flags="-O2"
            if [ "$mode" = sanitized ]; then
              flags="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer"
            fi
            g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror $flags \
              -Iinclude tests/streaming_ts_validator_tests.cpp \
              src/core/ts_streams.cpp -o "/tmp/ttnx-streaming-ts-${mode}"
            ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
              "/tmp/ttnx-streaming-ts-${mode}"
          done
