name: finalize-search-pagination-focus-docs

on:
  push:
    branches:
      - feature/m2-guest-browsing
    paths:
      - .github/workflows/finalize-search-pagination-focus-docs.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m2-guest-browsing
          fetch-depth: 0

      - name: Update hardware-gate documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def one(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1 match, got {n}")
              return text.replace(old, new, 1)

          road = Path('docs/ROADMAP.md')
          r = road.read_text()
          r = one(r,
              "- [x] Re-enable explicit continuation / `Load more` with append-only result Views at `534f576a77aeb8f7226b2f3a3549be23c621e06a`\n- [ ] Real-hardware continuation / `Load more` acceptance\n",
              "- [x] Re-enable explicit continuation / `Load more` with append-only result Views at `534f576a77aeb8f7226b2f3a3549be23c621e06a`\n- [x] Physically verify continuation fetch/append at `959a46e7c1d5de1743cdf3b11a48b1b227ab0b4e`\n- [x] Hardware-reject `959a46e...` focus UX after selector loss and Up-from-Load-more jump to result 1\n- [x] Prove pinned Borealis nested-Box/default-focus + ScrollingFrame recenter behavior behind that regression\n- [x] Implement focus fix + A-again detail toggle at `d432ef8c6eee8e1b77ecd8a96b78832c43bb8a5b`\n- [ ] Real-hardware continuation / `Load more` focus/UI acceptance\n",
              'roadmap')
          road.write_text(r)

          status = Path('docs/PROJECT_STATUS.md')
          s = status.read_text()
          s = one(s,
              "The real-Switch guest bootstrap, startup-recovery, first-page live Search, inline result-detail, and full sidebar traversal gates are physically accepted. Hardware-tested NRO head `d6910a232732b2bd9169abb11dfdf320cf35a34b` closes the blank-Search/Home-Search-focus regression introduced by `36015cb...`. Explicit continuation / `Load more` is now implemented at code checkpoint `534f576a77aeb8f7226b2f3a3549be23c621e06a` using append-only result Views; it is host validated and remains pending exact-head devkitA64 plus physical Switch acceptance.",
              "The real-Switch guest bootstrap, startup-recovery, first-page live Search, inline result-detail, and full sidebar traversal gates are physically accepted. Hardware-tested NRO head `d6910a232732b2bd9169abb11dfdf320cf35a34b` closes the blank-Search/Home-Search-focus regression introduced by `36015cb...`. Physical testing of continuation build `959a46e7c1d5de1743cdf3b11a48b1b227ab0b4e` proved that `Load more` fetches and appends additional videos, but rejected that overall UI checkpoint because the selector could move out of view and Up from `Load more` could jump to result 1. Focus-lifecycle fix `d432ef8c6eee8e1b77ecd8a96b78832c43bb8a5b` now explicitly routes Load-more-Up to the last result, defers focus to the first newly appended result after layout, and adds A-again inline-detail collapse; physical retest remains required.",
              'status intro')

          old = "Host validation passed all `22/22` test executables with added assertions for result preservation/retry, stale continuation rejection, terminal continuation, continuation-added selection, and continuation firewall behavior. The candidate is **not hardware accepted** until it passes the real-Switch continuation checklist."
          new = "Physical hardware subsequently proved the continuation request/data path at `959a46e7c1d5de1743cdf3b11a48b1b227ab0b4e`: additional videos fetched and appended without a crash. That overall UI checkpoint was rejected because the selector could become invisible after append and Up from the sibling `Load more` control could enter the nested results box at its first result. Pinned Borealis confirms the mechanism: sibling traversal into a Box resolves through that Box's default focus, while ScrollingFrame recenters on focus gain rather than merely on a focused View moving after layout growth. Fix `d432ef8c6eee8e1b77ecd8a96b78832c43bb8a5b` preserves append-only result Views, adds an explicit Up route from `Load more` to the current last result, queues focus by stable identity to the first newly appended result for the next post-layout frame, and lets A on an already-selected result call `clear_selection()` to collapse its inline detail. The continuation UI is **not hardware accepted** until that corrected focus sequence passes on the real Switch."
          s = one(s, old, new, 'status continuation')
          status.write_text(s)

          gates = Path('docs/HARDWARE_GATES.md')
          g = gates.read_text()
          g = one(g,
              "The continuation gate remains **NOT ACCEPTED** until focus remains visible and directional navigation is continuous across the last result / `Load more` boundary.\n\nAlso approved for the same UI-fix slice: inline result detail should become a toggle. Pressing A on an unselected result opens its normalized detail; pressing A again on the same result closes it using `SearchModel::clear_selection()` and the existing non-destructive detail visibility path. This must not rebuild result Views.\n",
              "The continuation gate remains **NOT ACCEPTED** until focus remains visible and directional navigation is continuous across the last result / `Load more` boundary.\n\nPinned Borealis source confirms the focus mechanism: Up from the sibling `Load more` control enters the nested result Box through its default focus, which resolves to result 1, while appending rows above an already-focused `Load more` button moves that button without generating a new child-focus event for ScrollingFrame recentering. Fix candidate `d432ef8c6eee8e1b77ecd8a96b78832c43bb8a5b` keeps the append-only result tree, routes Load-more-Up explicitly to the current last result, and defers focus by stable identity to the first newly-added result until the next post-layout frame.\n\nAlso implemented in the same UI-fix slice: inline result detail is now a toggle. Pressing A on an unselected result opens its normalized detail; pressing A again on the same result closes it using `SearchModel::clear_selection()` and the existing non-destructive detail visibility path. This does not rebuild result Views.\n",
              'hardware gates')
          gates.write_text(g)
          PY

      - name: Commit and push
        run: |
          git config user.name "GlitchedZeus"
          git config user.email "user91746@protonmail.com"
          git add docs/PROJECT_STATUS.md docs/ROADMAP.md docs/HARDWARE_GATES.md
          git commit -m "docs: record Search pagination focus fix"
          git push origin HEAD:feature/m2-guest-browsing
