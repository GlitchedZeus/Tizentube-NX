            "videoId": "abcdefghijk", "title": {"simpleText": "Safe Channel Video"}
          }}}}
        ]}}}}
      ]}}
    })JSON";
}

}  // namespace

int main() {
    using ttnx::core::BrowseSurface;
    using ttnx::core::GuestRequest;
    using ttnx::net::HttpMethod;
    using ttnx::youtube::execute_guest_channel;

    FakeHttpClient http;
