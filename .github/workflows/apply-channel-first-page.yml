name: apply-channel-first-page

on:
  push:
    branches:
      - feature/m2-guest-browsing
    paths:
      - .github/workflows/apply-channel-first-page.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-build-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m2-guest-browsing
          submodules: recursive
          fetch-depth: 0

      - name: Assert accepted starting history
        shell: bash
        run: |
          git merge-base --is-ancestor ca8467e459389c22afee4f26fbebcddc858634a8 HEAD
          test "$(git status --porcelain | wc -l)" -eq 0

      - name: Apply Channel first-page implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def write(path, content):
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content)

          write('include/tizentube_nx/core/channel_model.hpp', r'''#pragma once

#include "tizentube_nx/core/search_result.hpp"

#include <cstdint>
#include <string>
#include <string_view>
#include <vector>

namespace ttnx::core {

struct ChannelIdentity {
    std::string browse_id;
    std::string title;
};

struct ChannelMetadata {
    std::string title;
    std::string handle;
    std::string subscriber_text;
    std::string description;
    std::string canonical_url;
    std::vector<ThumbnailCandidate> thumbnails;
};

struct ChannelSection {
    std::string title;
    std::vector<BrowseResult> results;
};

struct ChannelPage {
    ChannelIdentity identity;
    ChannelMetadata metadata;
    std::vector<ChannelSection> sections;
    std::vector<BrowseResult> results;
    // Architectural seam only. M2 Channel first-page UI does not expose it.
    std::string continuation;

    [[nodiscard]] bool has_more() const noexcept { return !continuation.empty(); }
};

enum class ChannelViewState {
    Idle,
    Loading,
    Ready,
    Empty,
    Error,
};

// UI-thread-owned Channel state. Workers publish only normalized ChannelPage data
// plus the generation captured by begin_load(); Borealis Views never enter here.
class ChannelModel {
public:
    [[nodiscard]] std::uint64_t begin_load(ChannelIdentity identity);
    [[nodiscard]] bool apply_page(std::uint64_t generation, ChannelPage page);
    [[nodiscard]] bool fail(std::uint64_t generation, std::string error);
    void reset();

    [[nodiscard]] bool select(std::string_view identity);
    void clear_selection();

    [[nodiscard]] std::uint64_t generation() const noexcept { return generation_; }
    [[nodiscard]] ChannelViewState state() const noexcept { return state_; }
    [[nodiscard]] const ChannelIdentity& identity() const noexcept { return identity_; }
    [[nodiscard]] const ChannelPage& page() const noexcept { return page_; }
    [[nodiscard]] const ChannelMetadata& metadata() const noexcept { return page_.metadata; }
    [[nodiscard]] const std::vector<BrowseResult>& results() const noexcept { return page_.results; }
    [[nodiscard]] const std::vector<ChannelSection>& sections() const noexcept { return page_.sections; }
    [[nodiscard]] const std::string& selected_identity() const noexcept { return selected_identity_; }
    [[nodiscard]] const std::string& error() const noexcept { return error_; }

private:
    [[nodiscard]] bool contains_identity(std::string_view identity) const;

    std::uint64_t generation_{0};
    ChannelViewState state_{ChannelViewState::Idle};
    ChannelIdentity identity_;
    ChannelPage page_;
    std::string selected_identity_;
    std::string error_;
};

}  // namespace ttnx::core
''')

          write('src/core/channel_model.cpp', r'''#include "tizentube_nx/core/channel_model.hpp"

#include "tizentube_nx/core/search_result.hpp"

#include <algorithm>
#include <utility>

namespace ttnx::core {
namespace {

constexpr std::size_t kMaxChannelErrorBytes = 512;

std::string bounded_error(std::string error) {
    if (error.size() > kMaxChannelErrorBytes) error.resize(kMaxChannelErrorBytes);
    return error;
}

}  // namespace

std::uint64_t ChannelModel::begin_load(ChannelIdentity identity) {
    ++generation_;
    state_ = ChannelViewState::Loading;
    identity_ = std::move(identity);
    page_ = {};
    page_.identity = identity_;
    selected_identity_.clear();
    error_.clear();
    return generation_;
}

bool ChannelModel::apply_page(std::uint64_t generation, ChannelPage page) {
    if (generation != generation_ || state_ != ChannelViewState::Loading) return false;

    if (page.identity.browse_id.empty()) page.identity.browse_id = identity_.browse_id;
    if (page.identity.title.empty()) page.identity.title = identity_.title;
    if (page.metadata.title.empty()) page.metadata.title = page.identity.title;
    identity_ = page.identity;
    page_ = std::move(page);
    state_ = page_.results.empty() ? ChannelViewState::Empty : ChannelViewState::Ready;
    error_.clear();

    if (!selected_identity_.empty() && !contains_identity(selected_identity_)) {
        selected_identity_.clear();
    }
    return true;
}

bool ChannelModel::fail(std::uint64_t generation, std::string error) {
    if (generation != generation_ || state_ != ChannelViewState::Loading) return false;
    state_ = ChannelViewState::Error;
    error_ = bounded_error(std::move(error));
    return true;
}

void ChannelModel::reset() {
    ++generation_;
    state_ = ChannelViewState::Idle;
    identity_ = {};
    page_ = {};
    selected_identity_.clear();
    error_.clear();
}

bool ChannelModel::select(std::string_view identity) {
    if (identity.empty() || !contains_identity(identity)) return false;
    selected_identity_ = std::string(identity);
    return true;
}

void ChannelModel::clear_selection() {
    selected_identity_.clear();
}

bool ChannelModel::contains_identity(std::string_view identity) const {
    return std::any_of(page_.results.begin(), page_.results.end(), [&](const BrowseResult& result) {
        return browse_result_identity(result) == identity;
    });
}

}  // namespace ttnx::core
''')

          write('include/tizentube_nx/youtube/channel_response.hpp', r'''#pragma once

#include "tizentube_nx/core/channel_model.hpp"
#include "tizentube_nx/core/content_filter.hpp"

#include <optional>
#include <string>
#include <string_view>

namespace ttnx::youtube {

struct ChannelResponseParseResult {
    std::optional<core::ChannelPage> page;
    std::string error;
    // Bounded structural family names/counts only. Never raw response values,
    // titles, IDs, continuation tokens, visitor data, cookies or URLs.
    std::string diagnostics;

    [[nodiscard]] explicit operator bool() const noexcept { return page.has_value(); }
};

// Network-facing Channel parser boundary. Only the provider-selected browse tab
// and explicitly reviewed structural wrappers are traversed. Unknown/blocked
// wrappers stay opaque and unselected tabs/topbar/menu metadata remain out of scope.
[[nodiscard]] ChannelResponseParseResult parse_scoped_channel_response(
    std::string_view response_body,
    std::string_view expected_channel_id,
    const core::FilterPolicy& policy = {});

}  // namespace ttnx::youtube
''')

          write('include/tizentube_nx/youtube/guest_channel.hpp', r'''#pragma once

#include "tizentube_nx/core/channel_model.hpp"
#include "tizentube_nx/core/guest_browse.hpp"
#include "tizentube_nx/net/http.hpp"
#include "tizentube_nx/youtube/guest_api.hpp"

#include <optional>
#include <string>

namespace ttnx::youtube {

struct GuestChannelResult {
    std::optional<core::ChannelPage> page;
    std::string error;
    std::string diagnostics;

    [[nodiscard]] explicit operator bool() const noexcept { return page.has_value(); }
};

// Explicit first-page Channel boundary. Channel continuation remains disabled
// until the first-page shape is physically accepted.
[[nodiscard]] GuestChannelResult execute_guest_channel(
    net::HttpClient& http,
    const GuestSession& session,
    const core::GuestRequest& request,
    const core::FilterPolicy& policy = {});

}  // namespace ttnx::youtube
''')

          write('src/core/guest_channel.cpp', r'''#include "tizentube_nx/youtube/guest_channel.hpp"

#include "tizentube_nx/core/url.hpp"
#include "tizentube_nx/net/diagnostics.hpp"
#include "tizentube_nx/youtube/channel_response.hpp"

#include <utility>

namespace ttnx::youtube {
namespace {

GuestChannelResult fail(std::string error) {
    GuestChannelResult result;
    result.error = std::move(error);
    return result;
}

}  // namespace

GuestChannelResult execute_guest_channel(
    net::HttpClient& http,
    const GuestSession& session,
    const core::GuestRequest& request,
    const core::FilterPolicy& policy) {
    if (request.surface != core::BrowseSurface::Channel ||
        request.is_continuation() ||
        !core::valid_guest_request(request) ||
        !core::is_valid_channel_id(request.value)) {
        return fail("Guest Channel request is invalid.");
    }
    if (!session.usable()) return fail("Guest session is not usable.");

    const auto http_request = make_browse_request(session, request.value);
    if (!http_request) return fail("Could not build guest Channel request.");

    const auto http_result = http.perform(*http_request);
    if (!http_result.ok) {
        return fail(net::safe_public_diagnostic(
            http_result.error,
            "Guest Channel HTTP request failed."));
    }
    if (http_result.response.status_code < 200 || http_result.response.status_code >= 300) {
        return fail("Guest Channel returned a non-success HTTP status.");
    }

    auto parsed = parse_scoped_channel_response(
        http_result.response.body,
        request.value,
        policy);
    if (!parsed || !parsed.page) {
        auto result = fail(parsed.error.empty()
            ? std::string{"Guest Channel response was rejected."}
            : net::safe_public_diagnostic(
                  parsed.error,
                  "Guest Channel response was rejected."));
        result.diagnostics = std::move(parsed.diagnostics);
        return result;
    }

    GuestChannelResult result;
    result.page = std::move(parsed.page);
    result.diagnostics = std::move(parsed.diagnostics);
    return result;
}

}  // namespace ttnx::youtube
''')

          write('tests/channel_model_tests.cpp', r'''#include "tizentube_nx/core/channel_model.hpp"

#include <cstdlib>
#include <iostream>
#include <string>

namespace {

int failures = 0;
void expect(bool condition, const char* message) {
    if (!condition) {
        ++failures;
        std::cerr << "FAIL: " << message << '\n';
    }
}

ttnx::core::BrowseResult video(std::string id, std::string title) {
    ttnx::core::BrowseResult result;
    result.kind = ttnx::core::BrowseResultKind::Video;
    result.id = std::move(id);
    result.title = std::move(title);
    return result;
}

ttnx::core::ChannelPage page_with(std::string browse_id, std::initializer_list<ttnx::core::BrowseResult> results) {
    ttnx::core::ChannelPage page;
    page.identity.browse_id = std::move(browse_id);
    page.metadata.title = "Parsed Channel";
    for (const auto& result : results) page.results.push_back(result);
    return page;
}

}  // namespace

int main() {
    using namespace ttnx::core;

    ChannelModel model;
    expect(model.state() == ChannelViewState::Idle, "Channel starts idle");

    ChannelIdentity a{"UCabcdefghijklmnopqrstuv", "Search Channel A"};
    const auto g1 = model.begin_load(a);
    expect(model.state() == ChannelViewState::Loading, "begin_load enters Loading");
    expect(model.identity().browse_id == a.browse_id, "requested identity is retained while loading");

    auto page = page_with(a.browse_id, {video("abcdefghijk", "Alpha")});
    expect(model.apply_page(g1, std::move(page)), "matching generation applies Channel page");
    expect(model.state() == ChannelViewState::Ready, "non-empty Channel enters Ready");
    expect(model.results().size() == 1, "normalized results retained");
    expect(model.metadata().title == "Parsed Channel", "parsed Channel metadata retained");

    const auto selected = browse_result_identity(model.results()[0]);
    expect(model.select(selected), "Channel selection accepts normalized identity");
    expect(model.selected_identity() == selected, "Channel selection is View-independent");
    model.clear_selection();
    expect(model.selected_identity().empty(), "Channel selection clears non-destructively");

    ChannelIdentity b{"UC1234567890123456789012", "Channel B"};
    const auto stale = model.begin_load(b);
    ChannelIdentity c{"UC2345678901234567890123", "Channel C"};
    const auto fresh = model.begin_load(c);
    expect(!model.apply_page(stale, page_with(b.browse_id, {video("bbbbbbbbbbb", "Stale")})),
           "stale Channel A/B completion cannot overwrite newer request");
    expect(model.apply_page(fresh, page_with(c.browse_id, {video("ccccccccccc", "Fresh")})),
           "newest Channel completion applies");
    expect(model.results().size() == 1 && model.results()[0].id == "ccccccccccc",
           "fresh Channel result wins");

    const auto g4 = model.begin_load(c);
    ChannelPage empty;
    empty.identity = c;
    expect(model.apply_page(g4, std::move(empty)), "valid empty Channel page applies");
    expect(model.state() == ChannelViewState::Empty, "valid empty Channel enters Empty");

    const auto g5 = model.begin_load(c);
    expect(model.fail(g5, std::string(800, 'x')), "current Channel failure applies");
    expect(model.state() == ChannelViewState::Error, "Channel failure enters Error");
    expect(model.error().size() == 512, "Channel error text is bounded");

    model.reset();
    expect(model.state() == ChannelViewState::Idle, "Channel reset returns Idle");
    expect(model.results().empty(), "Channel reset clears result state");

    if (failures == 0) {
        std::cout << "All Channel model tests passed.\n";
        return EXIT_SUCCESS;
    }
    return EXIT_FAILURE;
}
''')

