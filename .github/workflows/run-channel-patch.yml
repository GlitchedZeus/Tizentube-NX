name: run-channel-patch

on:
  push:
    branches:
      - feature/m2-guest-browsing
    paths:
      - .github/workflows/run-channel-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m2-guest-browsing
          submodules: recursive
          fetch-depth: 0

      - name: Extract stored Channel patch safely
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/apply-channel-first-page.yml')
          t = p.read_text()
          marker = "          python3 - <<'PY'\n"
          start = t.index(marker) + len(marker)
          end = t.index('          PY\n', start)
          block = t[start:end]
          out = []
          inside_triple = False
          for line in block.splitlines(True):
              if inside_triple:
                  out.append(line)
                  if "'''" in line:
                      inside_triple = False
                  continue
              normalized = line[10:] if line.startswith('          ') else line
              out.append(normalized)
              if normalized.count("'''") % 2 == 1:
                  inside_triple = True
          code = ''.join(out)
          compile(code, '<channel-patch>', 'exec')
          Path('/tmp/channel_patch.py').write_text(code)
          PY

      - name: Apply stored Channel patch
        shell: bash
        run: |
          python3 /tmp/channel_patch.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/channel_response_tests.cpp')
          t = p.read_text()
          old = '{"continuationItemRenderer": {"continuationEndpoint": {"continuationCommand": {"token": "CHANNEL-NEXT"}}}'
          new = '{"continuationItemRenderer": {"continuationEndpoint": {"continuationCommand": {"token": "CHANNEL-NEXT"}}}}'
          if old not in t:
              raise SystemExit('expected continuation fixture fragment not found')
          p.write_text(t.replace(old, new, 1))
          PY

      - name: Configure host
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build host
        run: cmake --build build --parallel

      - name: Run host tests
        run: ctest --test-dir build --output-on-failure

      - name: Build Switch NRO
        run: >-
          docker run --rm
          -v "$PWD:/work"
          -w /work
          devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282
          make -f Makefile.switch -j2

      - name: Verify invariants
        shell: bash
        run: |
          test -f tizentube_nx.nro
          test -f tizentube_nx.elf
          test -f build-switch/tizentube_nx.map
          ! grep -a -qi 'libcurl' tizentube_nx.nro
          grep -q 'return normalized == "www.youtube.com";' src/core/outbound_policy.cpp
          grep -q 'nintendo.com' src/core/outbound_policy.cpp
          grep -q 'CPPFILES := $(filter-out curl_http_client.cpp,$(CPPFILES))' Makefile.switch

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "GlitchedZeus"
          git config user.email "user91746@protonmail.com"
          git add CMakeLists.txt include/tizentube_nx/core/channel_model.hpp include/tizentube_nx/youtube/channel_response.hpp include/tizentube_nx/youtube/guest_channel.hpp src/core/channel_model.cpp src/core/guest_channel.cpp src/core/home_response.cpp switch/source/main.cpp tests/channel_model_tests.cpp tests/channel_response_tests.cpp tests/guest_channel_tests.cpp docs/CHANNEL_GUEST_BROWSING.md docs/HARDWARE_GATES.md docs/HOME_GUEST_BROWSING.md docs/PROJECT_STATUS.md docs/ROADMAP.md
          git diff --cached --check
          git commit -m "m2: add first-page channel browsing"
          git push origin HEAD:feature/m2-guest-browsing
