          note = '''\n### Guest Home first page — zero-result diagnostic gate\n\nHardware-tested NRO head: `ba0066b34270bfa1809dc5d3567aead86a298033`\n\nPhysical Switch result: **REJECTED**. Guest bootstrap, sockets, SSL and verified HTTPS all succeeded, and the explicit `Load Home` action completed, but the UI reported `YouTube Home returned no supported normal results.` No Home rows were rendered. This is therefore treated as a Home response-shape/parser-scope problem, not a guest-network failure.\n\nThe next candidate adds bounded structural diagnostics only: browse layout, tab/selected-tab counts, reviewed renderer/container family names and counts, blocked-category counts, continuation-renderer counts, opaque-wrapper counts, and at most 16 bounded opaque family names. It never exposes titles, IDs, URLs, continuation tokens, visitor data, API keys, cookies, request headers or raw response bodies. Unknown wrappers remain opaque to normalization, and the diagnostic scanner also stops at them instead of inspecting descendants.\n\nThe exact M2 network allowlist remains `www.youtube.com:443`. Search checkpoint `428497c90be6e768c607e45c68171827d74f0faf` remains a protected accepted baseline. Home continuation, thumbnails, playback and OAuth remain disabled for this diagnostic gate.\n'''
          if '### Guest Home first page — zero-result diagnostic gate' not in text:
              text += note
          p.write_text(text)

          p = Path('docs/HOME_GUEST_BROWSING.md')
          text = p.read_text()
          note = '''\n## Physical zero-result diagnostic follow-up\n\nThe first physical Home candidate at `ba0066b34270bfa1809dc5d3567aead86a298033` reached `Guest ready` and completed `Load Home`, but normalized zero supported results. The diagnostic follow-up does **not** loosen the renderer firewall or introduce generic result recursion. It reports only bounded structural renderer/container-family information from the selected Home scope and stops at blocked or unknown families. This is intended to identify the real modern Home wrapper returned on hardware before any new family is admitted to normalization.\n'''
          if '## Physical zero-result diagnostic follow-up' not in text:
              text += note
          p.write_text(text)

          for doc, heading, body in [
              ('docs/PROJECT_STATUS.md', '## Home first-page hardware diagnostic gate', 'The first Home NRO at `ba0066b34270bfa1809dc5d3567aead86a298033` is physically rejected only for zero normalized Home results; guest networking succeeded. A privacy-safe structural diagnostic candidate is the active M2 task. Search through `428497c90be6e768c607e45c68171827d74f0faf` remains hardware accepted and protected.'),
              ('docs/ROADMAP.md', '## Active Home diagnostic gate', 'Before Home continuation, channel pages or playlist pages, identify the real guest Home renderer/container family returned on Switch using bounded structural diagnostics. Do not widen `www.youtube.com:443`, fetch thumbnails, add OAuth, or loosen the Shorts/ad/shopping firewall for this gate.'),
          ]:
              p = Path(doc)
              text = p.read_text()
              if heading not in text:
                  text += f'\n\n{heading}\n\n{body}\n'
              p.write_text(text)
          PY
