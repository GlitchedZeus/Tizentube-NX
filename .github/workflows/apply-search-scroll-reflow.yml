name: apply-search-scroll-reflow

on:
  push:
    branches:
      - feature/m2-guest-browsing
    paths:
      - .github/workflows/apply-search-scroll-reflow.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m2-guest-browsing
          fetch-depth: 0
          submodules: recursive

      - name: Apply dynamic Search scrolling fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # ------------------------------------------------------------------
          # Switch build: replace only the pinned Borealis ScrollingFrame
          # implementation with our project-local pixel-offset backport.
          # ------------------------------------------------------------------
          mk = Path('Makefile.switch')
          text = mk.read_text()
          old = '''# Keep the curl prototype in-tree as a reference only; it is not linked into the\n# release binary. Native libnx_http_client.cpp is the approved M2 transport.\nCPPFILES := $(filter-out curl_http_client.cpp,$(CPPFILES))\n'''
          new = '''# Keep the curl prototype in-tree as a reference only; it is not linked into the\n# release binary. Native libnx_http_client.cpp is the approved M2 transport.\nCPPFILES := $(filter-out curl_http_client.cpp,$(CPPFILES))\n# The pinned Borealis ScrollingFrame stores scroll position as a percentage of\n# content height, which desynchronizes the viewport when Search appends rows.\n# stable_scrolling_frame.cpp backports an absolute-pixel implementation while\n# preserving the pinned Borealis public API.\nCPPFILES := $(filter-out scrolling_frame.cpp,$(CPPFILES))\n'''
          if text.count(old) != 1:
              raise SystemExit('Makefile scrolling-frame insertion point mismatch')
          mk.write_text(text.replace(old, new, 1))

          # ------------------------------------------------------------------
          # Switch Search UI: explicitly re-run ScrollingFrame focus placement
          # after a continuation changed detached content size, and bound live
          # result Views so repeated continuation stress cannot grow UI objects
          # without limit. The SearchModel still retains all normalized results.
          # ------------------------------------------------------------------
          path = Path('switch/source/main.cpp')
          text = path.read_text()

          replacements = [
              (
                  '''constexpr std::size_t kMaxUiTitleChars = 180;\nconstexpr std::size_t kMaxUiMetadataChars = 280;\n''',
                  '''constexpr std::size_t kMaxUiTitleChars = 180;\nconstexpr std::size_t kMaxUiMetadataChars = 280;\n// Keep the temporary M2 text UI bounded on real hardware while the model may\n// retain many continuation pages. Final media UI can replace this with a\n// recycler/virtualized list without changing SearchModel semantics.\nconstexpr std::size_t kMaxRenderedSearchResults = 40;\n'''
              ),
              (
                  '''    void tick() {\n        pump_network_result();\n        pump_search_result();\n        update_frame_rate();\n    }\n''',
                  '''    void tick() {\n        // tick() runs after Borealis rendered/layouted the frame. A continuation\n        // completed during the previous tick can therefore safely re-center the\n        // still-focused Search control here using fresh Yoga coordinates.\n        apply_pending_search_scroll_reflow();\n        pump_network_result();\n        pump_search_result();\n        update_frame_rate();\n    }\n'''
              ),
              (
                  '''    brls::Button* search_load_more_button_{nullptr};\n    brls::Box* search_results_box_{nullptr};\n\n    struct SearchDetailRow {\n''',
                  '''    brls::Button* search_load_more_button_{nullptr};\n    brls::Box* search_results_box_{nullptr};\n    brls::ScrollingFrame* search_scroll_{nullptr};\n    bool search_scroll_reflow_pending_{false};\n\n    struct SearchDetailRow {\n'''
              ),
              (
                  '''    std::vector<SearchDetailRow> search_detail_rows_;\n\n    void refresh_footer() {\n''',
                  '''    std::vector<SearchDetailRow> search_detail_rows_;\n\n    void apply_pending_search_scroll_reflow() {\n        if (!search_scroll_reflow_pending_) return;\n        search_scroll_reflow_pending_ = false;\n        if (!search_scroll_ || !search_results_box_) return;\n\n        auto* focused = brls::Application::getCurrentFocus();\n        if (!focused) return;\n\n        bool search_result_focus = focused == search_load_more_button_;\n        if (!search_result_focus) {\n            for (const auto& row : search_detail_rows_) {\n                if (row.button == focused) {\n                    search_result_focus = true;\n                    break;\n                }\n            }\n        }\n        // A continuation may complete after B moved focus into the sidebar.\n        // Never use a sidebar coordinate to reposition the Search viewport.\n        if (!search_result_focus) return;\n\n        // Pinned ScrollingFrame has no public refresh method. Its public child\n        // focus callback is the supported path into the same centering logic.\n        // Our local pixel-offset backport makes this stable across content-size\n        // changes instead of reinterpreting a stale percentage against a new\n        // content height.\n        search_scroll_->onChildFocusGained(search_results_box_, focused);\n    }\n\n    void refresh_footer() {\n'''
              ),
              (
                  '''                if (search_model_.end_of_results()) {\n                    text += ". End of results.";\n                } else if (search_model_.can_load_more()) {\n                    text += ". More results are available.";\n                } else {\n                    text += '.';\n                }\n                return text;\n''',
                  '''                if (search_model_.end_of_results()) {\n                    text += ". End of results.";\n                } else if (search_model_.can_load_more()) {\n                    text += ". More results are available.";\n                } else {\n                    text += '.';\n                }\n                if (search_model_.results().size() > kMaxRenderedSearchResults) {\n                    text += " Hardware view shows newest " +\n                            std::to_string(kMaxRenderedSearchResults) +\n                            " while all loaded results remain in the model.";\n                }\n                return text;\n'''
              ),
              (
                  '''        // Full rebuilding is reserved for a genuinely new/reconstructed result\n        // page. Selection and continuation appends never delete existing rows.\n        search_detail_rows_.clear();\n        while (!search_results_box_->getChildren().empty()) {\n            search_results_box_->removeView(search_results_box_->getChildren().back());\n        }\n        (void)append_search_results_from(0);\n''',
                  '''        // Keep the live Borealis view tree bounded during continuation stress.\n        // SearchModel remains append-only/deduped; only the temporary text UI is\n        // windowed to the newest results.\n        search_detail_rows_.clear();\n        while (!search_results_box_->getChildren().empty()) {\n            search_results_box_->removeView(search_results_box_->getChildren().back());\n        }\n        const auto result_count = search_model_.results().size();\n        const std::size_t start = result_count > kMaxRenderedSearchResults\n            ? result_count - kMaxRenderedSearchResults\n            : 0;\n        (void)append_search_results_from(start);\n'''
              ),
              (
                  '''        if (applied_continuation) {\n            // SearchModel already deduped by stable identity. Append only rows\n            // that were not present before this continuation; never delete or\n            // replace the currently focused first-page result tree.\n            (void)append_search_results_from(previous_result_count);\n            refresh_search_inline_details();\n            refresh_search_page(false, search_model_.end_of_results());\n\n            // Real-hardware testing proved that force-focusing the first newly\n            // appended row can leave Borealis focus off-screen after the nested\n            // result box changes height. Keep the user's already-visible Load\n            // more focus instead. The explicit Up route is refreshed above and\n            // therefore enters the actual last appended result naturally. A\n            // terminal continuation still uses refresh_search_page()'s existing\n            // fallback before Load more is hidden.\n        } else {\n''',
                  '''        if (applied_continuation) {\n            // SearchModel already deduped by stable identity. Keep at most a\n            // bounded number of Borealis result Views alive on Switch. Small\n            // result sets still append in place; once the hardware UI budget is\n            // exceeded, rebuild only the newest window while the model retains\n            // every loaded result.\n            const std::size_t new_total = search_model_.results().size();\n            const std::size_t added = new_total >= previous_result_count\n                ? new_total - previous_result_count\n                : 0;\n            if (search_detail_rows_.size() + added > kMaxRenderedSearchResults) {\n                rebuild_search_results();\n            } else {\n                (void)append_search_results_from(previous_result_count);\n            }\n            refresh_search_inline_details();\n            refresh_search_page(false, search_model_.end_of_results());\n\n            // The focused control can move when the detached Search content is\n            // relaid out. Re-run ScrollingFrame centering after one rendered\n            // frame so it sees the new Yoga coordinates.\n            if (search_scroll_) search_scroll_reflow_pending_ = true;\n        } else {\n'''
              ),
              (
                  '''        search_load_more_button_ = nullptr;\n        search_results_box_ = nullptr;\n        search_detail_rows_.clear();\n        auto* scroll = new brls::ScrollingFrame();\n''',
                  '''        search_load_more_button_ = nullptr;\n        search_results_box_ = nullptr;\n        search_scroll_ = nullptr;\n        search_scroll_reflow_pending_ = false;\n        search_detail_rows_.clear();\n        auto* scroll = new brls::ScrollingFrame();\n'''
              ),
              (
                  '''        case RootSection::Search: {\n            label(content, "Search", 34);\n''',
                  '''        case RootSection::Search: {\n            search_scroll_ = scroll;\n            label(content, "Search", 34);\n'''
              ),
              (
                  '''            label(content,\n                  "Live guest Search is enabled with explicit Load more. Results stay text-only while thumbnail hosts remain blocked.",\n                  20);\n''',
                  '''            label(content,\n                  "Live guest Search is enabled with explicit Load more. Results stay text-only while thumbnail hosts remain blocked.",\n                  20);\n            label(content,\n                  "M2 stability note: the Switch view tree keeps only the newest 40 loaded results visible while SearchModel retains the full loaded set.",\n                  18);\n'''
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'main.cpp expected exactly one match, got {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)

          # ------------------------------------------------------------------
          # Record both physical rejection and the deeper root-cause finding.
          # ------------------------------------------------------------------
          gates = Path('docs/HARDWARE_GATES.md')
          doc = gates.read_text()
          marker = '## Current physical gate — Search continuation focus polish\n'
          if marker not in doc:
              raise SystemExit('hardware gate marker not found')

          note = '''### Second continuation-focus fix — hardware rejected; root cause narrowed\n\nHardware-tested NRO head: `c55abd6ffc09e72385fff478fefff06fed8a0473`\n\nPhysical Switch result: **REJECTED**. Keeping focus on the persistent `Load more` control did not fix the disappearing selector. Repeating `Load more` three times reproduced the same off-screen/blank-focus behavior. During further stress testing, roughly four to five continuation loads (about 60–80 visible results) also caused the app to exit unexpectedly, so repeated-pagination stability is now part of this gate rather than being treated as cosmetic focus polish.\n\nThe second hardware result disproves the prior assumption that the main problem was only programmatically transferring focus to the first newly-added row. The deeper issue is the pinned Borealis scroll representation itself: its `ScrollingFrame` stores `scrollY` as a **0..1 fraction of content height**, while the detached content already has an absolute pixel translation applied. When Search grows the nested result box, content height changes but the stored fraction and applied translation no longer describe the same viewport. Focus coordinates and visible scrolling can therefore diverge even when focus never changes.\n\nA mature Switch Borealis fork used by StreamFin independently moved this logic to an **absolute pixel content offset** (`contentOffsetY`) and applies translation directly from that pixel offset. The next candidate backports that representation locally without upgrading the whole pinned framework, then explicitly re-runs centering after continuation layout. It also bounds the temporary text UI to the newest 40 live result rows while keeping all normalized loaded results in `SearchModel`, preventing unbounded Borealis/Yoga view growth during repeated-pagination stress.\n\nThe unexpected exit is not yet attributed to a specific allocator, renderer, network or focus failure without a crash log. The bounded live view tree is therefore a defensive stability measure, not a claim that memory pressure was definitively the crash cause.\n\n'''
          if note not in doc:
              doc = doc.replace(marker, note + marker, 1)
              gates.write_text(doc)
          PY

      - name: Host validation
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      - name: Commit and push
        run: |
          git config user.name "GlitchedZeus"
          git config user.email "user91746@protonmail.com"
          git add Makefile.switch switch/source/main.cpp docs/HARDWARE_GATES.md
          git commit -m "ui: stabilize dynamic Search pagination scrolling"
          git push origin HEAD:feature/m2-guest-browsing
