name: apply-load-more-gate

on:
  push:
    branches:
      - feature/m2-guest-browsing
    paths:
      - .github/workflows/apply-load-more-gate.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m2-guest-browsing
          submodules: recursive

      - name: Apply asserted continuation UI patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('switch/source/main.cpp')
          text = main.read_text()

          old_pending = '''    bool pending_search_result_{false};
              std::uint64_t pending_search_generation_{0};
              ttnx::youtube::GuestSearchResult pending_search_;
              std::atomic_bool pending_search_emergency_{false};
              std::atomic<std::uint64_t> pending_search_emergency_generation_{0};
              std::atomic<ttnx::core::SearchErrorCode> pending_search_emergency_code_{
                  ttnx::core::SearchErrorCode::None};
          '''
          new_pending = '''    bool pending_search_result_{false};
              std::uint64_t pending_search_generation_{0};
              bool pending_search_continuation_{false};
              ttnx::youtube::GuestSearchResult pending_search_;
              std::atomic_bool pending_search_emergency_{false};
              std::atomic<std::uint64_t> pending_search_emergency_generation_{0};
              std::atomic_bool pending_search_emergency_continuation_{false};
              std::atomic<ttnx::core::SearchErrorCode> pending_search_emergency_code_{
                  ttnx::core::SearchErrorCode::None};
          '''
          assert old_pending in text, 'pending Search result fields changed'
          text = text.replace(old_pending, new_pending, 1)

          old_ui_members = '''    brls::Label* search_status_label_{nullptr};
              brls::Button* search_action_button_{nullptr};
              brls::Box* search_results_box_{nullptr};

              struct SearchDetailRow {
                  std::string identity;
                  brls::Label* detail{nullptr};
              };
          '''
          new_ui_members = '''    brls::Label* search_status_label_{nullptr};
              brls::Button* search_action_button_{nullptr};
              brls::Button* search_load_more_button_{nullptr};
              brls::Box* search_results_box_{nullptr};

              struct SearchDetailRow {
                  std::string identity;
                  brls::Button* button{nullptr};
                  brls::Label* detail{nullptr};
              };
          '''
          assert old_ui_members in text, 'Search UI pointer fields changed'
          text = text.replace(old_ui_members, new_ui_members, 1)

          text = text.replace(
              'text += ". More results are available; Load more is disabled for this hardware gate.";',
              'text += ". More results are available.";',
              1)
          text = text.replace(
              'return search_model_.can_load_more()\n                    ? "No results on this page. Load more is disabled for this hardware gate."\n                    : "No results found.";',
              'return search_model_.can_load_more()\n                    ? "No results on this page yet. More results are available."\n                    : "No results found.";',
              1)

          old_results_block = '''    void refresh_search_inline_details() {
                  const auto& selected_identity = search_model_.selected_identity();
                  for (auto& row : search_detail_rows_) {
                      if (!row.detail) continue;
                      const bool selected = !selected_identity.empty() && row.identity == selected_identity;
                      row.detail->setVisibility(
                          selected ? brls::Visibility::VISIBLE : brls::Visibility::GONE);
                  }
              }

              void rebuild_search_results() {
                  if (!search_results_box_) return;

                  // Full rebuilding is reserved for a genuinely new/reconstructed result
                  // page. Selecting a result never comes through this path, so the focused
                  // Borealis button remains alive for the entire A-button interaction.
                  search_detail_rows_.clear();
                  while (!search_results_box_->getChildren().empty()) {
                      search_results_box_->removeView(search_results_box_->getChildren().back());
                  }

                  const auto selected_identity = search_model_.selected_identity();

                  for (const auto& result : search_model_.results()) {
                      const auto identity = ttnx::core::browse_result_identity(result);
                      if (identity.empty()) continue;

                      std::string title = "[" + ttnx::core::search_result_kind_label(result.kind) + "] ";
                      title += result.title.empty() ? "Untitled result" : result.title;
                      auto* select = button(
                          search_results_box_,
                          bounded_ui_text(title, kMaxUiTitleChars));
                      select->setHeight(72);
                      select->registerClickAction([this, identity](brls::View*) {
                          if (!search_model_.select(identity)) return true;
                          // Non-destructive selection update: keep this focused button and
                          // the surrounding result tree alive. Only detail visibility changes.
                          refresh_search_inline_details();
                          return true;
                      });

                      auto* detail_label = label(
                          search_results_box_,
                          ttnx::core::search_result_selection_display(result),
                          18);
                      detail_label->setMarginBottom(14);
                      detail_label->setVisibility(
                          identity == selected_identity
                              ? brls::Visibility::VISIBLE
                              : brls::Visibility::GONE);
                      search_detail_rows_.push_back({identity, detail_label});

                      const auto metadata = ttnx::core::search_result_metadata_display(result);
                      if (!metadata.empty()) {
                          auto* metadata_label = label(
                              search_results_box_,
                              bounded_ui_text(metadata, kMaxUiMetadataChars),
                              18);
                          metadata_label->setMarginBottom(14);
                      }
                  }
              }

              void refresh_search_page(bool rebuild_results) {
                  if (search_query_label_) {
                      search_query_label_->setText(query_.empty()
                          ? "Query: none"
                          : "Query: " + bounded_ui_text(query_, 120));
                  }
                  if (search_status_label_) search_status_label_->setText(search_status_text());

                  if (search_action_button_) {
                      const bool retry_first_page =
                          search_model_.state() == ttnx::core::SearchViewState::Error &&
                          search_model_.retryable_failure() &&
                          search_model_.error_code() != ttnx::core::SearchErrorCode::ContinuationFailure;
                      search_action_button_->setText(search_busy_.load()
                          ? "Search: Working..."
                          : retry_first_page ? "Retry Search" : "Search");
                  }


                  if (rebuild_results) rebuild_search_results();
              }

          '''
          new_results_block = '''    void refresh_search_inline_details() {
                  const auto& selected_identity = search_model_.selected_identity();
                  for (auto& row : search_detail_rows_) {
                      if (!row.detail) continue;
                      const bool selected = !selected_identity.empty() && row.identity == selected_identity;
                      row.detail->setVisibility(
                          selected ? brls::Visibility::VISIBLE : brls::Visibility::GONE);
                  }
              }

              void append_search_result_row(const ttnx::core::BrowseResult& result) {
                  if (!search_results_box_) return;
                  const auto identity = ttnx::core::browse_result_identity(result);
                  if (identity.empty()) return;

                  std::string title = "[" + ttnx::core::search_result_kind_label(result.kind) + "] ";
                  title += result.title.empty() ? "Untitled result" : result.title;
                  auto* select = button(
                      search_results_box_,
                      bounded_ui_text(title, kMaxUiTitleChars));
                  select->setHeight(72);
                  select->registerClickAction([this, identity](brls::View*) {
                      if (!search_model_.select(identity)) return true;
                      // Selection never deletes or replaces the focused row.
                      refresh_search_inline_details();
                      return true;
                  });

                  auto* detail_label = label(
                      search_results_box_,
                      ttnx::core::search_result_selection_display(result),
                      18);
                  detail_label->setMarginBottom(14);
                  detail_label->setVisibility(
                      identity == search_model_.selected_identity()
                          ? brls::Visibility::VISIBLE
                          : brls::Visibility::GONE);
                  search_detail_rows_.push_back({identity, select, detail_label});

                  const auto metadata = ttnx::core::search_result_metadata_display(result);
                  if (!metadata.empty()) {
                      auto* metadata_label = label(
                          search_results_box_,
                          bounded_ui_text(metadata, kMaxUiMetadataChars),
                          18);
                      metadata_label->setMarginBottom(14);
                  }
              }

              void append_search_results_from(std::size_t start_index) {
                  if (!search_results_box_) return;
                  const auto& results = search_model_.results();
                  if (start_index > results.size()) return;
                  for (std::size_t i = start_index; i < results.size(); ++i) {
                      append_search_result_row(results[i]);
                  }
              }

              void rebuild_search_results() {
                  if (!search_results_box_) return;

                  // Full rebuilding is reserved for a genuinely new/reconstructed result
                  // page. Selection and continuation appends never delete existing rows.
                  search_detail_rows_.clear();
                  while (!search_results_box_->getChildren().empty()) {
                      search_results_box_->removeView(search_results_box_->getChildren().back());
                  }
                  append_search_results_from(0);
              }

              void refresh_search_load_more_control(bool focus_fallback_if_hiding = false) {
                  if (!search_load_more_button_) return;

                  const auto state = search_model_.state();
                  const bool retry_continuation =
                      state == ttnx::core::SearchViewState::Error &&
                      search_model_.retryable_failure() &&
                      search_model_.error_code() == ttnx::core::SearchErrorCode::ContinuationFailure;
                  const bool loadable =
                      (state == ttnx::core::SearchViewState::Ready ||
                       state == ttnx::core::SearchViewState::Empty) &&
                      search_model_.can_load_more();
                  const bool loading_more = state == ttnx::core::SearchViewState::LoadingMore;
                  const bool guest_ready = guest_session_ && guest_session_->usable();
                  const bool show = guest_ready && !network_busy_.load() &&
                                    (loadable || loading_more || retry_continuation);

                  if (!show) {
                      if (focus_fallback_if_hiding &&
                          brls::Application::getCurrentFocus() == search_load_more_button_) {
                          if (!search_detail_rows_.empty() && search_detail_rows_.back().button) {
                              brls::Application::giveFocus(search_detail_rows_.back().button);
                          } else if (search_action_button_) {
                              brls::Application::giveFocus(search_action_button_);
                          }
                      }
                      search_load_more_button_->setVisibility(brls::Visibility::GONE);
                      return;
                  }

                  search_load_more_button_->setVisibility(brls::Visibility::VISIBLE);
                  if (loading_more) {
                      search_load_more_button_->setText("Loading more...");
                  } else if (retry_continuation) {
                      search_load_more_button_->setText("Retry Load more");
                  } else {
                      search_load_more_button_->setText("Load more");
                  }
              }

              void refresh_search_page(
                  bool rebuild_results,
                  bool focus_fallback_if_hiding = false) {
                  if (search_query_label_) {
                      search_query_label_->setText(query_.empty()
                          ? "Query: none"
                          : "Query: " + bounded_ui_text(query_, 120));
                  }
                  if (search_status_label_) search_status_label_->setText(search_status_text());

                  if (search_action_button_) {
                      const bool retry_first_page =
                          search_model_.state() == ttnx::core::SearchViewState::Error &&
                          search_model_.retryable_failure() &&
                          search_model_.error_code() != ttnx::core::SearchErrorCode::ContinuationFailure;
                      search_action_button_->setText(search_busy_.load()
                          ? "Search: Working..."
                          : retry_first_page ? "Retry Search" : "Search");
                  }

                  if (rebuild_results) rebuild_search_results();
                  refresh_search_load_more_control(focus_fallback_if_hiding);
              }

          '''
          assert old_results_block in text, 'Search result/render block changed'
          text = text.replace(old_results_block, new_results_block, 1)

          old_worker_block = '''    void publish_search_result(
                  std::uint64_t generation,
                  ttnx::youtube::GuestSearchResult result) noexcept {
                  try {
                      std::lock_guard<std::mutex> lock(search_mutex_);
                      pending_search_generation_ = generation;
                      pending_search_ = std::move(result);
                      pending_search_result_ = true;
                  } catch (const std::bad_alloc&) {
                      pending_search_emergency_generation_.store(generation);
                      pending_search_emergency_code_.store(ttnx::core::SearchErrorCode::MemoryPressure);
                      pending_search_emergency_.store(true);
                  } catch (...) {
                      pending_search_emergency_generation_.store(generation);
                      pending_search_emergency_code_.store(ttnx::core::SearchErrorCode::InternalFailure);
                      pending_search_emergency_.store(true);
                  }
                  // Keep search_busy_ true until the UI thread joins and applies the
                  // completion. This closes the tiny window where a second button press
                  // could overwrite an unconsumed pending completion.
                  search_worker_done_.store(true);
              }

              void pump_search_result() {
                  if (!search_worker_done_.load()) return;
                  if (search_worker_.joinable()) search_worker_.join();

                  ttnx::youtube::GuestSearchResult result;
                  std::uint64_t generation = 0;
                  bool have_result = false;
                  {
                      std::lock_guard<std::mutex> lock(search_mutex_);
                      if (pending_search_result_) {
                          generation = pending_search_generation_;
                          result = std::move(pending_search_);
                          pending_search_result_ = false;
                          have_result = true;
                      }
                  }

                  const bool have_emergency = pending_search_emergency_.exchange(false);
                  const auto emergency_generation = pending_search_emergency_generation_.load();
                  const auto emergency_code = pending_search_emergency_code_.load();

                  search_worker_done_.store(false);
                  search_busy_.store(false);

                  bool applied = false;
                  if (have_result) {
                      if (result.page) {
                          applied = search_model_.apply_first_page(generation, *result.page);
                      } else {
                          auto code = result.error_code;
                          if (code == ttnx::core::SearchErrorCode::None) {
                              code = ttnx::core::SearchErrorCode::UnsupportedResponse;
                          }
                          applied = search_model_.fail(generation, code);
                      }
                  } else if (have_emergency) {
                      applied = search_model_.fail(emergency_generation, emergency_code);
                  }

                  refresh_footer();
                  if (applied) refresh_search_page(true);
                  else refresh_search_page(false);
              }

              void launch_search_worker(
                  std::uint64_t generation,
                  std::string query) {
                  if (!guest_session_ || !guest_session_->usable()) return;
                  if (search_worker_.joinable()) search_worker_.join();

                  search_busy_.store(true);
                  search_worker_done_.store(false);
                  refresh_footer();
                  refresh_search_page(false);

                  try {
                      const auto session = *guest_session_;
                      search_worker_ = std::thread(
                          [this, generation, query = std::move(query), session] {
                              ttnx::youtube::SearchWorkerStage stage =
                                  ttnx::youtube::SearchWorkerStage::BuildingRequest;
                              search_worker_stage_.store(stage);
                              auto protected_result = ttnx::youtube::protect_search_worker_operation(
                                  stage,
                                  [&] {
                                      stage = ttnx::youtube::SearchWorkerStage::SendingRequest;
                                      search_worker_stage_.store(stage);
                                      auto result = search_flow_.begin(network_client_, session, query);
                                      stage = ttnx::youtube::SearchWorkerStage::Normalizing;
                                      search_worker_stage_.store(stage);
                                      return result;
                                  },
                                  [&] {
                                      search_flow_.reset();
                                  });
                              search_worker_stage_.store(protected_result.failure_stage);
                              publish_search_result(
                                  generation, std::move(protected_result.result));
                              if (!protected_result.caught_exception) {
                                  search_worker_stage_.store(ttnx::youtube::SearchWorkerStage::Complete);
                              }
                          });
                  } catch (const std::bad_alloc&) {
                      search_busy_.store(false);
                      search_worker_done_.store(false);
                      const bool applied = search_model_.fail(
                          generation, ttnx::core::SearchErrorCode::MemoryPressure);
                      refresh_footer();
                      refresh_search_page(applied);
                  } catch (...) {
                      search_busy_.store(false);
                      search_worker_done_.store(false);
                      const bool applied = search_model_.fail(
                          generation, ttnx::core::SearchErrorCode::InternalFailure);
                      refresh_footer();
                      refresh_search_page(applied);
                  }
              }
          '''
          new_worker_block = '''    void publish_search_result(
                  std::uint64_t generation,
                  bool continuation,
                  ttnx::youtube::GuestSearchResult result) noexcept {
                  try {
                      std::lock_guard<std::mutex> lock(search_mutex_);
                      pending_search_generation_ = generation;
                      pending_search_continuation_ = continuation;
                      pending_search_ = std::move(result);
                      pending_search_result_ = true;
                  } catch (const std::bad_alloc&) {
                      pending_search_emergency_generation_.store(generation);
                      pending_search_emergency_continuation_.store(continuation);
                      pending_search_emergency_code_.store(ttnx::core::SearchErrorCode::MemoryPressure);
                      pending_search_emergency_.store(true);
                  } catch (...) {
                      pending_search_emergency_generation_.store(generation);
                      pending_search_emergency_continuation_.store(continuation);
                      pending_search_emergency_code_.store(ttnx::core::SearchErrorCode::InternalFailure);
                      pending_search_emergency_.store(true);
                  }
                  // Keep search_busy_ true until the UI thread joins and applies the
                  // completion. This closes the tiny window where a second button press
                  // could overwrite an unconsumed pending completion.
                  search_worker_done_.store(true);
              }

              void pump_search_result() {
                  if (!search_worker_done_.load()) return;
                  if (search_worker_.joinable()) search_worker_.join();

                  ttnx::youtube::GuestSearchResult result;
                  std::uint64_t generation = 0;
                  bool continuation = false;
                  bool have_result = false;
                  {
                      std::lock_guard<std::mutex> lock(search_mutex_);
                      if (pending_search_result_) {
                          generation = pending_search_generation_;
                          continuation = pending_search_continuation_;
                          result = std::move(pending_search_);
                          pending_search_result_ = false;
                          have_result = true;
                      }
                  }

                  const bool have_emergency = pending_search_emergency_.exchange(false);
                  const auto emergency_generation = pending_search_emergency_generation_.load();
                  const bool emergency_continuation =
                      pending_search_emergency_continuation_.load();
                  const auto emergency_code = pending_search_emergency_code_.load();

                  search_worker_done_.store(false);
                  search_busy_.store(false);

                  const std::size_t previous_result_count = search_model_.results().size();
                  bool applied = false;
                  bool applied_continuation = false;
                  if (have_result) {
                      applied_continuation = continuation;
                      if (result.page) {
                          applied = continuation
                              ? search_model_.apply_continuation(generation, *result.page)
                              : search_model_.apply_first_page(generation, *result.page);
                      } else {
                          auto code = result.error_code;
                          if (code == ttnx::core::SearchErrorCode::None) {
                              code = ttnx::core::SearchErrorCode::UnsupportedResponse;
                          }
                          applied = search_model_.fail(generation, code);
                      }
                  } else if (have_emergency) {
                      applied_continuation = emergency_continuation;
                      applied = search_model_.fail(emergency_generation, emergency_code);
                  }

                  refresh_footer();
                  if (!applied) {
                      refresh_search_page(false);
                      return;
                  }

                  if (applied_continuation) {
                      // SearchModel already deduped by stable identity. Append only rows
                      // that were not present before this continuation; never delete or
                      // replace the currently focused first-page result tree.
                      append_search_results_from(previous_result_count);
                      refresh_search_inline_details();
                      refresh_search_page(false, search_model_.end_of_results());
                  } else {
                      refresh_search_page(true);
                  }
              }

              void launch_search_worker(
                  std::uint64_t generation,
                  std::string query,
                  bool continuation = false) {
                  if (!guest_session_ || !guest_session_->usable()) return;
                  if (search_worker_.joinable()) search_worker_.join();

                  search_busy_.store(true);
                  search_worker_done_.store(false);
                  refresh_footer();
                  refresh_search_page(false);

                  try {
                      const auto session = *guest_session_;
                      search_worker_ = std::thread(
                          [this, generation, query = std::move(query), session, continuation] {
                              ttnx::youtube::SearchWorkerStage stage =
                                  ttnx::youtube::SearchWorkerStage::BuildingRequest;
                              search_worker_stage_.store(stage);
                              auto protected_result = ttnx::youtube::protect_search_worker_operation(
                                  stage,
                                  [&] {
                                      stage = ttnx::youtube::SearchWorkerStage::SendingRequest;
                                      search_worker_stage_.store(stage);
                                      auto result = continuation
                                          ? search_flow_.next(network_client_, session)
                                          : search_flow_.begin(network_client_, session, query);
                                      stage = ttnx::youtube::SearchWorkerStage::Normalizing;
                                      search_worker_stage_.store(stage);
                                      return result;
                                  },
                                  [this, continuation] {
                                      // A first-page exception must not leave a half-active
                                      // flow. A continuation exception keeps the current token
                                      // so the explicit Retry Load more action remains valid.
                                      if (!continuation) search_flow_.reset();
                                  });
                              search_worker_stage_.store(protected_result.failure_stage);
                              publish_search_result(
                                  generation,
                                  continuation,
                                  std::move(protected_result.result));
                              if (!protected_result.caught_exception) {
                                  search_worker_stage_.store(ttnx::youtube::SearchWorkerStage::Complete);
                              }
                          });
                  } catch (const std::bad_alloc&) {
                      search_busy_.store(false);
                      search_worker_done_.store(false);
                      const bool applied = search_model_.fail(
                          generation, ttnx::core::SearchErrorCode::MemoryPressure);
                      refresh_footer();
                      refresh_search_page(false);
                      (void)applied;
                  } catch (...) {
                      search_busy_.store(false);
                      search_worker_done_.store(false);
                      const bool applied = search_model_.fail(
                          generation, ttnx::core::SearchErrorCode::InternalFailure);
                      refresh_footer();
                      refresh_search_page(false);
                      (void)applied;
                  }
              }
          '''
          assert old_worker_block in text, 'Search worker block changed'
          text = text.replace(old_worker_block, new_worker_block, 1)

          old_retry = '''    void retry_search_request() {
                  if (search_busy_.load() || network_busy_.load()) return;
                  if (!guest_session_ || !guest_session_->usable()) {
                      refresh_search_page(false);
                      return;
                  }

                  const auto generation = search_model_.generation();
                  if (!search_model_.begin_retry(generation)) return;
                  refresh_search_page(false);
                  launch_search_worker(generation, search_model_.query());
              }

          '''
          new_retry = '''    void retry_search_request() {
                  if (search_busy_.load() || network_busy_.load()) return;
                  if (!guest_session_ || !guest_session_->usable()) {
                      refresh_search_page(false);
                      return;
                  }

                  const auto generation = search_model_.generation();
                  if (!search_model_.begin_retry(generation)) return;
                  refresh_search_page(false);
                  launch_search_worker(generation, search_model_.query());
              }

              void start_load_more() {
                  if (search_busy_.load() || network_busy_.load()) return;
                  if (!guest_session_ || !guest_session_->usable()) {
                      refresh_search_page(false);
                      return;
                  }

                  const auto generation = search_model_.generation();
                  const bool retry_continuation =
                      search_model_.state() == ttnx::core::SearchViewState::Error &&
                      search_model_.retryable_failure() &&
                      search_model_.error_code() == ttnx::core::SearchErrorCode::ContinuationFailure;

                  if (retry_continuation) {
                      if (!search_model_.begin_retry(generation)) return;
                  } else if (!search_model_.begin_load_more(generation)) {
                      return;
                  }

                  // Keep all existing result Views alive while the continuation runs.
                  refresh_search_page(false);
                  launch_search_worker(generation, {}, true);
              }

          '''
          assert old_retry in text, 'retry Search block changed'
          text = text.replace(old_retry, new_retry, 1)

          old_clear = '''        search_status_label_ = nullptr;
                  search_action_button_ = nullptr;
                  search_results_box_ = nullptr;
                  search_detail_rows_.clear();
          '''
          new_clear = '''        search_status_label_ = nullptr;
                  search_action_button_ = nullptr;
                  search_load_more_button_ = nullptr;
                  search_results_box_ = nullptr;
                  search_detail_rows_.clear();
          '''
          assert old_clear in text, 'Search page pointer clear block changed'
          text = text.replace(old_clear, new_clear, 1)

          old_search_intro = '''            label(content,
                            "First-page live guest Search is enabled. Results stay text-only while thumbnail hosts remain blocked.",
                            20);
          '''
          new_search_intro = '''            label(content,
                            "Live guest Search is enabled with explicit Load more. Results stay text-only while thumbnail hosts remain blocked.",
                            20);
          '''
          assert old_search_intro in text, 'Search intro changed'
          text = text.replace(old_search_intro, new_search_intro, 1)

          old_search_tail = '''            search_results_box_ = new brls::Box(brls::Axis::COLUMN);
                      search_results_box_->setMarginBottom(8);
                      content->addView(search_results_box_);

                      label(content,
                            "Load more is disabled for this hardware gate. No Shorts, ads, promoted or shopping renderers may reach this list.",
                            18);
                      refresh_search_page(true);
          '''
          new_search_tail = '''            search_results_box_ = new brls::Box(brls::Axis::COLUMN);
                      search_results_box_->setMarginBottom(8);
                      content->addView(search_results_box_);

                      search_load_more_button_ = button(content, "Load more");
                      search_load_more_button_->registerClickAction([this](brls::View*) {
                          start_load_more();
                          return true;
                      });
                      label(content,
                            "Load more is explicit for this hardware gate. No Shorts, ads, promoted or shopping renderers may reach any page.",
                            18);
                      refresh_search_page(true);
          '''
          assert old_search_tail in text, 'Search result tail changed'
          text = text.replace(old_search_tail, new_search_tail, 1)

          main.write_text(text)

          model_tests = Path('tests/search_model_tests.cpp')
          mt = model_tests.read_text()
          marker = '''    if (failures == 0) {
          '''
          assert mt.count(marker) == 1, 'search_model_tests final marker changed'
          extra_model = '''    SearchModel continuation_preserve;
              const auto preserve_generation = continuation_preserve.begin_query("preserve page one");
              BrowsePage preserve_first;
              preserve_first.results = {
                  video("KEEPVIDEO01", "Keep one"),
                  video("KEEPVIDEO02", "Keep two")};
              preserve_first.continuation = "KEEP-NEXT";
              expect(continuation_preserve.apply_first_page(preserve_generation, preserve_first),
                     "continuation preservation fixture accepts first page");
              expect(continuation_preserve.select("video:KEEPVIDEO02"),
                     "continuation preservation fixture selects first-page result");
              expect(continuation_preserve.begin_load_more(preserve_generation),
                     "continuation preservation fixture starts load more");
              expect(continuation_preserve.fail(preserve_generation, SearchErrorCode::HttpFailure),
                     "continuation failure is accepted");
              expect(continuation_preserve.results().size() == 2,
                     "continuation failure preserves existing first-page results");
              expect(continuation_preserve.selected_identity() == "video:KEEPVIDEO02",
                     "continuation failure preserves valid inline selection");
              expect(continuation_preserve.error_code() == SearchErrorCode::ContinuationFailure,
                     "continuation failure uses the dedicated safe error code");
              expect(continuation_preserve.begin_retry(preserve_generation),
                     "continuation failure remains explicitly retryable");
              BrowsePage preserve_next;
              preserve_next.results = {video("NEWVIDEO001", "New continuation result")};
              preserve_next.continuation = "KEEP-NEXT-2";
              expect(continuation_preserve.apply_continuation(preserve_generation, preserve_next),
                     "retried continuation appends successfully");
              expect(continuation_preserve.results().size() == 3,
                     "retried continuation appends without replacing first page");
              expect(continuation_preserve.select("video:NEWVIDEO001"),
                     "continuation-added result can become the stable selection");

              SearchModel stale_continuation;
              const auto stale_cont_generation = stale_continuation.begin_query("old continuation");
              expect(stale_continuation.apply_first_page(stale_cont_generation, preserve_first),
                     "stale continuation fixture accepts old first page");
              expect(stale_continuation.begin_load_more(stale_cont_generation),
                     "stale continuation fixture starts old continuation");
              const auto replacement_generation = stale_continuation.begin_query("replacement query");
              BrowsePage stale_page;
              stale_page.results = {video("STALEPAGE01", "Must not append")};
              expect(!stale_continuation.apply_continuation(stale_cont_generation, stale_page),
                     "stale continuation completion cannot append into a new query");
              expect(stale_continuation.generation() == replacement_generation &&
                         stale_continuation.results().empty(),
                     "replacement query remains authoritative after stale continuation completion");

              SearchModel terminal_continuation;
              const auto terminal_generation = terminal_continuation.begin_query("terminal continuation");
              expect(terminal_continuation.apply_first_page(terminal_generation, preserve_first),
                     "terminal continuation fixture accepts first page");
              expect(terminal_continuation.begin_load_more(terminal_generation),
                     "terminal continuation fixture starts load more");
              BrowsePage terminal_page;
              expect(terminal_continuation.apply_continuation(terminal_generation, terminal_page),
                     "zero-result terminal continuation is accepted");
              expect(terminal_continuation.results().size() == preserve_first.results.size(),
                     "zero-result terminal continuation preserves existing results");
              expect(terminal_continuation.end_of_results() && !terminal_continuation.can_load_more(),
                     "zero-result terminal continuation cleanly ends pagination");

          '''
          mt = mt.replace(marker, extra_model + marker, 1)
          model_tests.write_text(mt)

          flow_tests = Path('tests/search_flow_tests.cpp')
          ft = flow_tests.read_text()
          helper_anchor = '''std::string continuation_page(std::string id, std::string token = {}) {
              std::string tail;
              if (!token.empty()) {
                  tail = ", {\\\"continuationItemView\\\":{\\\"continuationCommand\\\":{\\\"token\\\":\\\"" +
                         token + "\\\"}}}";
              }
              return "{\\\"onResponseReceivedCommands\\\":[{\\\"appendContinuationItemsAction\\\":{"
                  "\\\"continuationItems\\\":[{\\\"videoRenderer\\\":{\\\"videoId\\\":\\\"" + id +
                  "\\\",\\\"title\\\":{\\\"simpleText\\\":\\\"Next\\\"}}}" + tail + "]}}]}";
          }

          '''
          helper_new = helper_anchor + '''std::string filtered_continuation_page() {
              return R"JSON({
                "onResponseReceivedCommands":[{"appendContinuationItemsAction":{
                  "continuationItems":[
                    {"reelShelfRenderer":{"items":[{"videoRenderer":{
                      "videoId":"SHORT000001","title":{"simpleText":"Blocked short"}}}]}},
                    {"promotedVideoRenderer":{"videoRenderer":{
                      "videoId":"ADVIDEO0001","title":{"simpleText":"Blocked ad"}}}},
                    {"productListRenderer":{"contents":[{"videoRenderer":{
                      "videoId":"SHOPVIDEO001","title":{"simpleText":"Blocked shopping"}}}]}},
                    {"videoRenderer":{"videoId":"SAFEVIDEO01","title":{"simpleText":"Safe continuation"}}}
                  ]
                }}]
              })JSON";
          }

          '''
          assert helper_anchor in ft, 'search_flow_tests continuation helper changed'
          ft = ft.replace(helper_anchor, helper_new, 1)

          final_marker = '''    if (failures == 0) {
          '''
          assert ft.count(final_marker) == 1, 'search_flow_tests final marker changed'
          firewall_case = '''    ScriptedHttpClient continuation_firewall;
              continuation_firewall.scripted = {
                  ok(first_page("FIREWALL001", "FILTER-TOKEN")),
                  ok(filtered_continuation_page()),
              };
              GuestSearchFlow firewall_flow;
              expect(firewall_flow.begin(continuation_firewall, guest, "filtered continuation").page.has_value(),
                     "continuation firewall fixture first page succeeds");
              const auto filtered = firewall_flow.next(continuation_firewall, guest);
              expect(filtered.page.has_value(), "continuation firewall page remains usable");
              if (filtered.page) {
                  expect(filtered.page->results.size() == 1,
                         "continuation firewall drops Shorts, promoted and shopping subtrees");
                  if (filtered.page->results.size() == 1) {
                      expect(filtered.page->results[0].id == "SAFEVIDEO01",
                             "continuation firewall preserves only the safe normalized video");
                  }
              }
              expect(!firewall_flow.can_continue(),
                     "filtered terminal continuation ends pagination normally");

          '''
          ft = ft.replace(final_marker, firewall_case + final_marker, 1)
          flow_tests.write_text(ft)
          PY

      - name: Host configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Host build
        run: cmake --build build --parallel
      - name: Host tests
        run: ctest --test-dir build --output-on-failure
      - name: Switch build
        run: >-
