name: apply-search-detail-screen

on:
  push:
    branches:
      - feature/m2-guest-browsing
    paths:
      - .github/workflows/apply-search-detail-screen.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m2-guest-browsing
      - name: Apply asserted Search detail-screen patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('switch/source/main.cpp')
          text = main.read_text()

          anchor = '''brls::Button* button(brls::Box* box, const std::string& text) {
              auto* view = new brls::Button();
              view->setText(text);
              view->setHeight(64);
              view->setMarginBottom(20);
              box->addView(view);
              return view;
          }

          class ShellActivity : public brls::Activity {
          '''
          replacement = '''brls::Button* button(brls::Box* box, const std::string& text) {
              auto* view = new brls::Button();
              view->setText(text);
              view->setHeight(64);
              view->setMarginBottom(20);
              box->addView(view);
              return view;
          }

          class SearchResultActivity : public brls::Activity {
          public:
              explicit SearchResultActivity(ttnx::core::BrowseResult result)
                  : result_(std::move(result)) {}

              brls::View* createContentView() override {
                  auto* frame = new brls::AppletFrame();
                  frame->setTitle("Search result");

                  auto* scroll = new brls::ScrollingFrame();
                  auto* content = new brls::Box(brls::Axis::COLUMN);
                  content->setPadding(32, 36, 32, 36);
                  scroll->setContentView(content);
                  frame->setContentView(scroll);

                  const auto kind = ttnx::core::search_result_kind_label(result_.kind);
                  const auto title = result_.title.empty() ? std::string("Untitled result") : result_.title;
                  label(content, "[" + kind + "] " + bounded_ui_text(title, kMaxUiTitleChars), 30);

                  const auto metadata = ttnx::core::search_result_metadata_display(result_);
                  if (!metadata.empty()) {
                      label(content, bounded_ui_text(metadata, kMaxUiMetadataChars), 20);
                  }

                  label(content, ttnx::core::search_result_selection_display(result_), 20);
                  label(content,
                        "This screen uses only the normalized Search result already in memory. No extra network request is made.",
                        18);

                  auto close = [content](brls::View*) {
                      brls::Application::popActivity();
                      return true;
                  };
                  button(content, "Back to Search")->registerClickAction(close);
                  content->registerAction("Back", brls::BUTTON_B, close);
                  return frame;
              }

          private:
              ttnx::core::BrowseResult result_;
          };

          class ShellActivity : public brls::Activity {
          '''
          assert anchor in text, 'button/ShellActivity anchor changed'
          text = text.replace(anchor, replacement, 1)

          old_members = '''    brls::Label* search_status_label_{nullptr};
              brls::Button* search_action_button_{nullptr};
              brls::Box* search_results_box_{nullptr};
              brls::Label* search_selection_label_{nullptr};
          '''
          new_members = '''    brls::Label* search_status_label_{nullptr};
              brls::Button* search_action_button_{nullptr};
              brls::Box* search_results_box_{nullptr};
          '''
          assert old_members in text, 'selection member block changed'
          text = text.replace(old_members, new_members, 1)

          old_click = '''            select->registerClickAction([this, identity](brls::View*) {
                          if (!search_model_.select(identity)) return true;
                          refresh_search_selection();
                          return true;
                      });
          '''
          new_click = '''            select->registerClickAction([this, identity](brls::View*) {
                          if (!search_model_.select(identity)) return true;
                          if (const auto* selected = selected_search_result()) {
                              brls::Application::pushActivity(new SearchResultActivity(*selected));
                          }
                          return true;
                      });
          '''
          assert old_click in text, 'result click block changed'
          text = text.replace(old_click, new_click, 1)

          old_refresh = '''    void refresh_search_selection() {
                  if (!search_selection_label_) return;
                  if (const auto* result = selected_search_result()) {
                      search_selection_label_->setText(
                          ttnx::core::search_result_selection_display(*result));
                  } else {
                      search_selection_label_->setText(
                          "Select a result to inspect its normalized identity. Playback is not enabled yet.");
                  }
              }

          '''
          assert old_refresh in text, 'refresh_search_selection block changed'
          text = text.replace(old_refresh, '', 1)

          old_page_refresh = '''        if (rebuild_results) rebuild_search_results();
                  refresh_search_selection();
              }
          '''
          new_page_refresh = '''        if (rebuild_results) rebuild_search_results();
              }
          '''
          assert old_page_refresh in text, 'refresh_search_page tail changed'
          text = text.replace(old_page_refresh, new_page_refresh, 1)

          old_clear = '''        search_action_button_ = nullptr;
                  search_results_box_ = nullptr;
                  search_selection_label_ = nullptr;
                  auto* scroll = new brls::ScrollingFrame();
          '''
          new_clear = '''        search_action_button_ = nullptr;
                  search_results_box_ = nullptr;
                  auto* scroll = new brls::ScrollingFrame();
          '''
          assert old_clear in text, 'page pointer clear block changed'
          text = text.replace(old_clear, new_clear, 1)

          old_search_ui = '''            search_status_label_ = label(content, "", 20);
                      search_results_box_ = new brls::Box(brls::Axis::COLUMN);
                      search_results_box_->setMarginBottom(8);
                      content->addView(search_results_box_);

                      search_selection_label_ = label(
                          content,
                          "Select a result to inspect its normalized identity. Playback is not enabled yet.",
                          18);
                      label(content,
                            "Load more is disabled for this hardware gate. No Shorts, ads, promoted or shopping renderers may reach this list.",
                            18);
          '''
          new_search_ui = '''            search_status_label_ = label(content, "", 20);
                      label(content,
                            "Press A on any result to open its normalized ID and clean canonical URL.",
                            18);
                      search_results_box_ = new brls::Box(brls::Axis::COLUMN);
                      search_results_box_->setMarginBottom(8);
                      content->addView(search_results_box_);

                      label(content,
                            "Load more is disabled for this hardware gate. No Shorts, ads, promoted or shopping renderers may reach this list.",
                            18);
          '''
          assert old_search_ui in text, 'Search UI result-detail block changed'
          text = text.replace(old_search_ui, new_search_ui, 1)

          assert 'search_selection_label_' not in text, 'old bottom selection label survived'
          main.write_text(text)

          status = Path('docs/PROJECT_STATUS.md')
          s = status.read_text()
          old_phase = '''The real-Switch guest bootstrap and startup-recovery gates are accepted. First-page live Search is being re-enabled incrementally on the accepted plain-page shell; physical live-Search acceptance remains pending.'''
          new_phase = '''The real-Switch guest bootstrap, startup-recovery, and first-page live Search gates are accepted. The accepted first-page Search checkpoint is `a5fb638abd6e41d82490a460f41ea096b11d1ea5`; the next UI-only checkpoint fixes result-detail visibility without changing Search networking.'''
          assert old_phase in s, 'PROJECT_STATUS phase text changed'
          s = s.replace(old_phase, new_phase, 1)

          old_selection = '''### Result selection seam

          Selecting a result proves normalized routing without starting playback.

          The temporary selection detail displays normalized title/type/ID and, when the stable ID is valid, a locally generated canonical clean URL:

          - Video: `https://www.youtube.com/watch?v=VIDEO_ID`
          - Channel: canonical stable `/channel/CHANNEL_ID` URL
          - Playlist: canonical `playlist?list=PLAYLIST_ID` URL

          No source tracking parameters are preserved.
          '''
          new_selection = '''### Result selection seam

          Selecting a result proves normalized routing without starting playback.

          Hardware testing of checkpoint `a5fb638abd6e41d82490a460f41ea096b11d1ea5` exposed a presentation-only issue: the original detail label lived after the entire results box, so its normalized ID/URL was usually off-screen unless a result near the bottom of the first page was selected.

          The follow-up UI opens a dedicated Borealis result-detail activity when A is pressed. It displays normalized title/type/ID and, when the stable ID is valid, a locally generated canonical clean URL immediately, with B returning to Search:

          - Video: `https://www.youtube.com/watch?v=VIDEO_ID`
          - Channel: canonical stable `/channel/CHANNEL_ID` URL
          - Playlist: canonical `playlist?list=PLAYLIST_ID` URL

          The detail activity consumes only the already-normalized in-memory result and performs no additional network request. No source tracking parameters are preserved.
          '''
          assert old_selection in s, 'PROJECT_STATUS selection seam changed'
          s = s.replace(old_selection, new_selection, 1)

          old_gate = '''## Current activation gate

          The real-Switch guest bootstrap remains accepted as `Guest ready`.

          The startup-recovery NRO at checkpoint `dbe1de9e0aa278999479dd3eac7a04d37b005b58` has now also been physically tested on the Atmosphère Switch and **booted without crashing**. Treat startup recovery as hardware accepted.

          The original pre-first-frame `std::abort (0xFFE)` root cause remains **UNKNOWN**. Do not attribute it to Search networking, `bad_alloc`, or the worker hardening without new evidence.

          The current gate is incremental first-page live Search reactivation on the accepted plain `ScrollingFrame` shell. The build must keep startup boot markers, no remote thumbnails, no `Load more`, and the exact `www.youtube.com:443` allowlist.

          Live Search remains **not hardware accepted** until the new NRO passes the next physical Search test.
          '''
          new_gate = '''## Current activation gate

          The real-Switch guest bootstrap remains accepted as `Guest ready`.

          The startup-recovery NRO at checkpoint `dbe1de9e0aa278999479dd3eac7a04d37b005b58` is physically accepted and boots without the earlier pre-first-frame abort.

          First-page live Search is now also **PHYSICALLY ACCEPTED** at checkpoint `a5fb638abd6e41d82490a460f41ea096b11d1ea5`. On the real Atmosphère Switch, the query `nintendo switch homebrew` returned 15 normalized live results, the UI reported that more results were available, controller navigation worked, and selecting a normal video produced its normalized video ID plus clean canonical `https://www.youtube.com/watch?v=...` URL. The user supplied screenshots of both the live result list and the selected-video detail.

          The hardware test also found one presentation-only defect: the selection detail label was positioned after the whole first-page result list, making it difficult to see for non-bottom results. The next UI checkpoint replaces that list-bottom label with a dedicated result-detail activity opened by A and closed with B. This does not alter the accepted Search POST/parser/session/network path.

          The original pre-first-frame `std::abort (0xFFE)` root cause remains **UNKNOWN**. Do not retroactively attribute it to Search networking, `bad_alloc`, or the worker hardening without new evidence.

          `Load more` remains disabled until the result-detail UI checkpoint is verified and continuation is deliberately reintroduced as its own hardware-gated slice. Startup boot markers, remote-thumbnail blocking, and the exact `www.youtube.com:443` allowlist remain unchanged.
          '''
          assert old_gate in s, 'PROJECT_STATUS activation gate changed'
          s = s.replace(old_gate, new_gate, 1)

          old_tail = '''- Next hardware gate is first-page Search only: preserve the accepted startup shell, manually establish the memory-only guest session, enter a query, verify keyboard close does not search, explicitly press Search, navigate/select normalized results, leave/re-enter Search, exit, and relaunch. `Load more` remains disabled for this gate.'''
          new_tail = '''- First-page Search was subsequently exercised successfully on the physical Atmosphère Switch at `a5fb638abd6e41d82490a460f41ea096b11d1ea5`: the live query returned 15 results and a selected normal video showed its normalized ID and clean canonical URL. First-page live Search is therefore **PHYSICALLY ACCEPTED**. A presentation-only follow-up moves selection details into a dedicated activity because the original label was usually below the visible list. `Load more` remains disabled pending the next hardware-gated slice.'''
          assert old_tail in s, 'PROJECT_STATUS crash-investigation tail changed'
          s = s.replace(old_tail, new_tail, 1)
          status.write_text(s)

          roadmap = Path('docs/ROADMAP.md')
          r = roadmap.read_text()
          old_roadmap = '''- [x] Keep `Load more` UI disabled for the first Search-reactivation hardware gate
          - [ ] Real-hardware first-page live Search acceptance
          '''
          new_roadmap = '''- [x] Keep `Load more` UI disabled for the first Search-reactivation hardware gate
          - [x] Real-hardware first-page live Search acceptance
          - [x] Replace the list-bottom selection detail with a dedicated A-open/B-back result-detail activity
          - [ ] Real-hardware result-detail activity acceptance
          - [ ] Re-enable continuation / `Load more` as a separate hardware-gated slice
          '''
          assert old_roadmap in r, 'ROADMAP Search gate block changed'
          r = r.replace(old_roadmap, new_roadmap, 1)
          roadmap.write_text(r)
          PY
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "GlitchedZeus"
          git config user.email "user91746@protonmail.com"
          git add switch/source/main.cpp docs/PROJECT_STATUS.md docs/ROADMAP.md
          git diff --cached --check
          git diff --cached --stat
          git commit -m "switch: open Search result details in dedicated view"
          git push origin HEAD:feature/m2-guest-browsing
